<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phú Quốc 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #F7F6F2;
  --surface: #FFFFFF;
  --border:  #E4E2DC;
  --border2: #F0EEE8;
  --nav:     #0C1829;
  --nav2:    #152338;
  --ocean:   #0C6E8F;
  --ocean2:  #0A5A77;
  --teal:    #0EA5C9;
  --gold:    #E8A020;
  --coral:   #D4614A;
  --sand:    #F5EDD8;
  --text:    #111110;
  --text2:   #52524E;
  --text3:   #A8A49E;
  --green:   #047857;
  --green-bg:#D1FAE5;
  --blue:    #0369A1;
  --blue-bg: #DBEAFE;
  --amber:   #92400E;
  --amber-bg:#FEF3C7;
  --red:     #B91C1C;
  --red-bg:  #FEE2E2;

  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-serif:   'Instrument Serif', Georgia, serif;
  --f-body:    'Plus Jakarta Sans', system-ui, sans-serif;

  --r:   10px;
  --r2:  16px;
  --r3:  22px;

  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 16px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:  0 12px 40px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--f-body); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-tap-highlight-color: transparent; min-height: 100vh; }

/* ━━━ NAV ━━━ */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.nav-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: stretch; min-height: 54px;
}
.nav-brand {
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 20px 0 0; border-right: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0; gap: 1px; padding-right: 20px;
}
.nav-brand-name {
  font-family: var(--f-serif); font-size: 15px; font-weight: 400;
  color: #fff; letter-spacing: .01em; line-height: 1;
  font-style: italic;
}
.nav-brand-sub {
  font-size: 10px; color: rgba(255,255,255,.3);
  letter-spacing: .1em; font-weight: 500;
}
.nav-tabs {
  display: flex; overflow-x: auto; scrollbar-width: none; flex: 1;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.ntab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 18px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.4); cursor: pointer; border: none;
  background: none; font-family: var(--f-body); white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color .18s, border-color .18s;
}
.ntab:hover { color: rgba(255,255,255,.75); }
.ntab.on { color: #fff; border-bottom-color: var(--gold); }
.ntab-icon { font-size: 13px; }
.nav-sync {
  display: flex; align-items: center; padding: 0 16px;
  font-size: 12px; color: rgba(255,255,255,.3); flex-shrink: 0;
}

/* ━━━ TRIP STRIP ━━━ */
.trip-strip {
  background: var(--nav2);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.trip-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; gap: 0; align-items: stretch;
  overflow-x: auto; scrollbar-width: none;
}
.trip-inner::-webkit-scrollbar { display: none; }
.ts {
  display: flex; flex-direction: column; justify-content: center;
  padding: 8px 20px; border-right: 1px solid rgba(255,255,255,.06);
  flex-shrink: 0;
}
.ts:last-child { border-right: none; }
.ts-l { font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); margin-bottom: 2px; }
.ts-v { font-size: 12px; color: rgba(255,255,255,.75); font-weight: 500; }

/* ━━━ MAIN ━━━ */
.main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 100px; }

/* ━━━ STAT ROW ━━━ */
.stat-row {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.stat-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px; padding: 7px 14px 7px 10px;
  box-shadow: var(--shadow-sm);
}
.stat-pill-num {
  font-family: var(--f-display); font-size: 18px; font-weight: 700;
  color: var(--ocean); line-height: 1;
}
.stat-pill-lbl { font-size: 11.5px; color: var(--text3); font-weight: 500; }
.stat-pill.hi { background: var(--ocean); border-color: var(--ocean); }
.stat-pill.hi .stat-pill-num { color: #fff; }
.stat-pill.hi .stat-pill-lbl { color: rgba(255,255,255,.6); }

/* ━━━ NOTE ━━━ */
.note-strip {
  background: var(--amber-bg); border: 1px solid #FCD34D;
  border-radius: var(--r2); padding: 10px 14px;
  font-size: 12.5px; color: var(--amber); line-height: 1.6;
  margin-bottom: 18px;
}

/* ━━━ DAY LIST ━━━ */
.day-list { display: flex; flex-direction: column; gap: 4px; }
.day-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s;
}
.day-row:hover { box-shadow: var(--shadow-md); }
.day-header {
  display: flex; align-items: center; gap: 0;
  cursor: pointer; user-select: none; min-height: 52px;
}
.day-num-col {
  width: 72px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 0 8px;
  background: var(--ocean); height: 100%; min-height: 52px;
}
.day-num-d {
  font-family: var(--f-display); font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,.5); line-height: 1; letter-spacing: .04em;
}
.day-num-date {
  font-size: 10px; color: rgba(255,255,255,.4);
  margin-top: 1px; letter-spacing: .02em;
}
.day-row.open .day-num-col { background: var(--ocean2); }
.day-title-col { flex: 1; padding: 0 16px; }
.day-title { font-size: 14px; font-weight: 600; color: var(--text); }
.day-hotel-tag {
  display: inline-block; font-size: 10.5px; font-weight: 500;
  padding: 3px 10px; border-radius: 20px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text2); white-space: nowrap; flex-shrink: 0;
}
.day-arr {
  padding: 0 16px 0 8px; font-size: 10px; color: var(--text3);
  transition: transform .2s; flex-shrink: 0;
}
.day-row.open .day-arr { transform: rotate(180deg); }
.day-body {
  display: none; padding: 12px 16px 14px;
  border-top: 1px solid var(--border2);
}
.day-row.open .day-body { display: block; }

/* ━━━ TIMELINE ━━━ */
.tl { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: 12px; }
.tl::before {
  content: ''; position: absolute; left: 39px; top: 10px; bottom: 10px;
  width: 1px; background: var(--border2); pointer-events: none;
}
.tl-item {
  display: flex; align-items: flex-start; gap: 0;
  padding: 4px 4px 4px 0; border-radius: 8px; cursor: pointer;
  transition: background .12s; position: relative;
}
.tl-item:hover { background: var(--bg); }
.tl-item.done .tl-content { opacity: .4; text-decoration: line-through; text-decoration-color: var(--text3); }
.tl-item.done .tl-dot-wrap .tl-dot { background: var(--border) !important; }
.tl-time {
  width: 36px; flex-shrink: 0; font-size: 10.5px; color: var(--text3);
  padding-top: 5px; text-align: right; padding-right: 6px;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.tl-dot-wrap {
  width: 16px; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; padding-top: 7px; z-index: 1;
}
.tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.d-meal  { background: #059669; }
.d-pool  { background: #0284C7; }
.d-out   { background: var(--coral); }
.d-hotel { background: var(--ocean); }
.d-eve   { background: var(--gold); }
.tl-content {
  flex: 1; padding: 3px 8px 3px 8px; display: flex;
  align-items: center; gap: 8px; min-width: 0;
}
.tl-text { font-size: 13px; color: var(--text); line-height: 1.45; flex: 1; min-width: 0; }
.tl-tag {
  display: inline-block; font-size: 10px; padding: 1px 7px;
  border-radius: 20px; font-weight: 600; white-space: nowrap;
  vertical-align: middle; margin-left: 4px; flex-shrink: 0;
}
.t-meal  { background: var(--green-bg); color: var(--green); }
.t-pool  { background: var(--blue-bg); color: var(--blue); }
.t-out   { background: var(--red-bg); color: var(--red); }
.t-hotel { background: #E0F2FE; color: #0369A1; }
.t-eve   { background: var(--amber-bg); color: var(--amber); }
.tl-acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; flex-shrink: 0; }
.tl-item:hover .tl-acts { opacity: 1; }
.tl-btn {
  font-size: 11px; padding: 2px 7px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; color: var(--text3); font-family: var(--f-body);
  transition: all .12s;
}
.tl-btn:hover { background: var(--bg); color: var(--ocean); border-color: var(--ocean); }
.tl-add {
  margin-top: 10px; font-size: 12px; padding: 6px 14px;
  border-radius: 20px; border: 1px dashed var(--border);
  background: transparent; cursor: pointer; color: var(--text3);
  font-family: var(--f-body); transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
}
.tl-add:hover { background: var(--bg); color: var(--ocean); border-style: solid; border-color: var(--ocean); }

/* ━━━ SECTION HEADING ━━━ */
.section-h {
  font-family: var(--f-serif); font-size: 1.35rem; font-style: italic;
  color: var(--ocean); margin: 28px 0 12px;
  display: flex; align-items: center; gap: 10px;
}
.section-h::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ━━━ FILTER ROW ━━━ */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.fchip {
  font-size: 12px; padding: 5px 14px; border-radius: 20px;
  border: 1px solid var(--border); cursor: pointer;
  background: var(--surface); color: var(--text2);
  font-family: var(--f-body); transition: all .14s;
  box-shadow: var(--shadow-sm);
}
.fchip.on { background: var(--ocean); color: #fff; border-color: var(--ocean); box-shadow: 0 2px 8px rgba(12,110,143,.3); }
.fchip:hover:not(.on) { border-color: var(--ocean); color: var(--ocean); }

/* ━━━ SEARCH ━━━ */
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap::before { content: '🔍'; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 13px; }
.search-input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1.5px solid var(--border); border-radius: var(--r2);
  font-size: 13px; font-family: var(--f-body); background: var(--surface);
  color: var(--text); outline: none; transition: border-color .15s;
  box-shadow: var(--shadow-sm);
}
.search-input:focus { border-color: var(--ocean); }

/* ━━━ ACTIVITY CARDS ━━━ */
.act-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px; margin-bottom: 6px;
}
.act-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); overflow: hidden;
  box-shadow: var(--shadow-sm); transition: box-shadow .18s, transform .18s;
  display: flex; flex-direction: column;
}
.act-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.act-top { padding: 14px 14px 10px; flex: 1; }
.act-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--bg); display: flex; align-items: center;
  justify-content: center; font-size: 20px; margin-bottom: 10px;
}
.act-name { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
.act-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
.act-note { font-size: 11px; color: var(--text3); margin-top: 4px; font-style: italic; }
.act-bot {
  padding: 10px 14px;
  border-top: 1px solid var(--border2);
  display: flex; align-items: center; gap: 6px;
}
.act-price { font-size: 11px; color: var(--text3); flex: 1; line-height: 1.3; }
.status-btn {
  font-size: 10.5px; font-weight: 600; padding: 3px 11px; border-radius: 20px;
  cursor: pointer; border: 1.5px solid var(--border); background: transparent;
  font-family: var(--f-body); color: var(--text3); transition: all .14s; flex-shrink: 0;
}
.status-btn:hover { border-color: var(--ocean); color: var(--ocean); }
.status-btn.booked { background: var(--blue-bg); color: var(--blue); border-color: #93C5FD; }
.status-btn.done   { background: var(--green-bg); color: var(--green); border-color: #6EE7B7; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center;
  border: 1px solid var(--border); background: transparent; cursor: pointer;
  font-size: 12px; color: var(--text3); transition: all .12s; flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg); border-color: var(--text3); color: var(--text); }

/* ━━━ RESTAURANT CARDS ━━━ */
.rest-list { display: flex; flex-direction: column; gap: 8px; }
.rest-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); padding: 14px 16px;
  display: flex; gap: 12px; align-items: flex-start;
  box-shadow: var(--shadow-sm); transition: box-shadow .18s;
}
.rest-card:hover { box-shadow: var(--shadow-md); }
.rest-emoji {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: var(--bg); display: flex; align-items: center;
  justify-content: center; font-size: 22px;
}
.rest-body { flex: 1; min-width: 0; }
.rest-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.rest-name { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.2; }
.visited-badge {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  background: var(--green-bg); color: var(--green); flex-shrink: 0;
}
.rest-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
.rest-cat { font-size: 11.5px; color: var(--coral); font-weight: 600; }
.rest-region {
  font-size: 10.5px; background: var(--bg); color: var(--text2);
  padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border);
}
.rest-desc { font-size: 12.5px; color: var(--text2); line-height: 1.5; }
.rest-note { font-size: 11.5px; color: var(--text3); margin-top: 3px; font-style: italic; }
.rest-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.visit-btn {
  font-size: 12px; padding: 5px 14px; border-radius: 20px;
  border: 1.5px solid var(--border); background: transparent; cursor: pointer;
  color: var(--text2); font-family: var(--f-body); transition: all .14s;
}
.visit-btn.on { background: var(--green-bg); color: var(--green); border-color: #6EE7B7; }
.visit-btn:hover:not(.on) { border-color: var(--ocean); color: var(--ocean); }
.text-btn {
  font-size: 12px; padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid var(--border); background: transparent;
  cursor: pointer; font-family: var(--f-body); transition: all .14s;
}
.text-btn.edit { color: var(--ocean); }
.text-btn.del  { color: var(--coral); }
.text-btn:hover { background: var(--bg); }

/* ━━━ HOTEL FACILITIES ━━━ */
.hotel-section { margin-bottom: 32px; }
.hotel-sect-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px; flex-wrap: wrap;
}
.hotel-sect-name {
  font-family: var(--f-display); font-size: 1.15rem; font-weight: 700;
  color: var(--text); flex: 1;
}
.hotel-period {
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  padding: 4px 12px; border-radius: 20px;
  background: var(--ocean); color: #fff;
}
.hotel-progress { font-size: 12px; color: var(--text3); }
.hotel-table-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); overflow: hidden; box-shadow: var(--shadow-sm);
}
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--nav); color: rgba(255,255,255,.6);
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 10px 14px; text-align: left;
  font-family: var(--f-body);
}
tbody tr { transition: background .1s; }
tbody tr:hover td { background: var(--bg); }
tbody td {
  padding: 11px 14px; border-bottom: 1px solid var(--border2);
  font-size: 12.5px; vertical-align: middle; color: var(--text);
}
tbody tr:last-child td { border-bottom: none; }
.badge {
  display: inline-block; font-size: 9.5px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px;
}
.badge-free { background: #DCFCE7; color: #15803D; }
.badge-paid { background: #FEE2E2; color: #B91C1C; }
.check-btn {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border);
  background: transparent; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all .14s; color: transparent;
}
.check-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.check-btn.on { background: var(--green-bg); color: var(--green); border-color: #6EE7B7; }
.hotel-tip {
  margin-top: 10px; padding: 10px 14px;
  background: #F0F9FF; border-left: 3px solid var(--teal);
  border-radius: 0 var(--r) var(--r) 0;
  font-size: 12.5px; color: #0C4A6E; line-height: 1.6;
}

/* ━━━ FAB ━━━ */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--ocean); color: #fff; font-size: 22px;
  border: none; cursor: pointer; z-index: 90;
  box-shadow: 0 4px 16px rgba(12,110,143,.4), 0 2px 6px rgba(12,110,143,.2);
  display: flex; align-items: center; justify-content: center;
  transition: all .18s;
}
.fab:hover { background: var(--ocean2); box-shadow: 0 6px 24px rgba(12,110,143,.5); transform: translateY(-1px); }
.fab:active { transform: translateY(0); }
.fab.hidden { display: none; }

/* ━━━ MODAL ━━━ */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  backdrop-filter: blur(6px); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.on { display: flex; }
.modal-box {
  background: var(--surface); border-radius: 24px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp .22s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-hd {
  padding: 22px 22px 0; display: flex;
  align-items: center; justify-content: space-between; gap: 12px;
}
.modal-ttl { font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; color: var(--text); }
.modal-x {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg); cursor: pointer; font-size: 14px; color: var(--text3);
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.modal-x:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 18px 22px; }
.f-row { margin-bottom: 14px; }
.f-label { font-size: 11.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px; display: block; }
.f-inp, .f-sel, .f-ta {
  width: 100%; padding: 10px 13px; border: 1.5px solid var(--border);
  border-radius: var(--r); font-size: 13px; font-family: var(--f-body);
  background: var(--bg); color: var(--text); outline: none;
  transition: border-color .15s;
}

// ━━━ STATE ━━━
const SERVER_URL = 'https://osaka-trip-server.onrender.com';
let state = {};
let _syncTimer = null;

function getDefault() {
  return {
    version: 2,
    schedule: SEED_SCHEDULE.map(d => ({...d, items: d.items.map(i => ({...i, done: false}))})),
    activities: JSON.parse(JSON.stringify(SEED_ACTIVITIES)),
    restaurants: JSON.parse(JSON.stringify(SEED_RESTAURANTS)),
    hotelDone: {},
  };
}

function loadState() {
  try {
    const s = localStorage.getItem('phuquoc2026');
    if (s) { state = JSON.parse(s); return; }
  } catch(e) {}
  state = getDefault();
}

function saveState() {
  localStorage.setItem('phuquoc2026', JSON.stringify(state));
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(doSync, 800);
}

function setSyncStatus(s) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const m = {syncing:'🔄', ok:'☁️', error:'⚠️'};
  const t = {syncing:'저장 중…', ok:'동기화됨', error:'저장 실패'};
  el.textContent = m[s] || ''; el.title = t[s] || '';
}

async function doSync() {
  setSyncStatus('syncing');
  try {
    const r = await fetch(`${SERVER_URL}/phuquoc/state`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state),
    });
    setSyncStatus(r.ok ? 'ok' : 'error');
  } catch(e) { setSyncStatus('error'); }
}

async function loadFromServer() {
  try {
    const r = await fetch(`${SERVER_URL}/phuquoc/state`);
    if (!r.ok) return;
    const sv = await r.json();
    if (!sv || !sv.version) return;
    state = sv;
    localStorage.setItem('phuquoc2026', JSON.stringify(state));
    renderMain(); setSyncStatus('ok');
  } catch(e) {}
}

// ━━━ TABS ━━━
let activeTab = 'schedule';

function switchTab(id) {
  activeTab = id;
  const labels = {schedule:'일정표', activities:'액티비티', restaurants:'맛집', hotels:'호텔'};
  document.querySelectorAll('.ntab').forEach(b =>
    b.classList.toggle('on', b.textContent.trim().includes(labels[id]))
  );
  document.getElementById('fab').classList.toggle('hidden', id === 'hotels');
  renderMain();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function handleFab() {
  if (activeTab === 'schedule') showAddTLModal(0);
  else if (activeTab === 'activities') showAddActModal();
  else if (activeTab === 'restaurants') showAddRestModal();
}

function renderMain() {
  const el = document.getElementById('main');
  if (activeTab === 'schedule') el.innerHTML = renderSchedule();
  else if (activeTab === 'activities') el.innerHTML = renderActivities();
  else if (activeTab === 'restaurants') el.innerHTML = renderRestaurants();
  else if (activeTab === 'hotels') el.innerHTML = renderHotels();
}

// ━━━ SCHEDULE ━━━
const DOT = {meal:'d-meal',pool:'d-pool',out:'d-out',hotel:'d-hotel',eve:'d-eve'};
const TAG  = {meal:'t-meal',pool:'t-pool',out:'t-out',hotel:'t-hotel',eve:'t-eve'};

function renderSchedule() {
  const done = state.schedule.reduce((a,d) => a + d.items.filter(i=>i.done).length, 0);
  const total = state.schedule.reduce((a,d) => a + d.items.length, 0);
  const pct = Math.round(done / Math.max(total,1) * 100);
  return `
    <div class="stat-row">
      <div class="stat-pill hi"><span class="stat-pill-num">14</span><span class="stat-pill-lbl">일</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${done}</span><span class="stat-pill-lbl">완료</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${total - done}</span><span class="stat-pill-lbl">남음</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${pct}%</span><span class="stat-pill-lbl">진행률</span></div>
    </div>
    <div class="note-strip">⚡ 사전 예약 필수: INK 360 선셋 좌석 / 4섬 호핑투어 / 빈펄 사파리+빈원더스 / 혼똔섬 케이블카 / 각 리조트 스파</div>
    <div class="day-list">
      ${state.schedule.map((day, di) => `
        <div class="day-row" id="dc${di}">
          <div class="day-header" onclick="toggleDay(${di})">
            <div class="day-num-col">
              <div class="day-num-d">${day.d}</div>
              <div class="day-num-date">${day.date}</div>
            </div>
            <div class="day-title-col">
              <div class="day-title">${day.title}</div>
            </div>
            <span class="day-hotel-tag">${day.hotel}</span>
            <span class="day-arr">▼</span>
          </div>
          <div class="day-body">
            <div class="tl">
              ${day.items.map((item, ii) => renderTLItem(di, item, ii, ii === day.items.length - 1)).join('')}
            </div>
            <button class="tl-add" onclick="showAddTLModal(${di})">＋ 항목 추가</button>
          </div>
        </div>`).join('')}
    </div>`;
}

function renderTLItem(di, item, ii, isLast) {
  const tagHtml = item.tag
    ? `<span class="tl-tag ${TAG[item.tagType] || TAG[item.type] || 't-hotel'}">${item.tag}</span>`
    : '';
  return `<div class="tl-item${item.done?' done':''}" onclick="toggleDone(${di},${ii})">
    <span class="tl-time">${item.time}</span>
    <div class="tl-dot-wrap"><span class="tl-dot ${DOT[item.type]||'d-hotel'}"></span></div>
    <div class="tl-content">
      <span class="tl-text">${item.text}${tagHtml}</span>
      <div class="tl-acts">
        <button class="tl-btn" onclick="event.stopPropagation();showEditTLModal(${di},${ii})">✎</button>
        <button class="tl-btn" onclick="event.stopPropagation();delTLItem(${di},${ii})">✕</button>
      </div>
    </div>
  </div>`;
}

function toggleDay(di) {
  document.getElementById('dc'+di).classList.toggle('open');
}

function toggleDone(di, ii) {
  state.schedule[di].items[ii].done = !state.schedule[di].items[ii].done;
  saveState(); renderMain();
  requestAnimationFrame(() => { document.getElementById('dc'+di)?.classList.add('open'); });
}

function delTLItem(di, ii) {
  if (!confirm('삭제할까요?')) return;
  state.schedule[di].items.splice(ii, 1);
  saveState(); renderMain();
  requestAnimationFrame(() => { document.getElementById('dc'+di)?.classList.add('open'); });
}

// ━━━ ACTIVITIES ━━━
let aRegion = 'all';

function renderActivities() {
  const regions = [...new Set(state.activities.map(a => a.region))];
  const booked = state.activities.filter(a => a.status==='booked').length;
  const done   = state.activities.filter(a => a.status==='done').length;
  const list = aRegion === 'all' ? state.activities : state.activities.filter(a => a.region === aRegion);
  return `
    <div class="stat-row">
      <div class="stat-pill hi"><span class="stat-pill-num">${state.activities.length}</span><span class="stat-pill-lbl">전체</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${booked}</span><span class="stat-pill-lbl">예약완료</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${done}</span><span class="stat-pill-lbl">완료</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${state.activities.length-booked-done}</span><span class="stat-pill-lbl">미예약</span></div>
    </div>
    <div class="filter-row">
      <span class="fchip${aRegion==='all'?' on':''}" onclick="aRegion='all';renderMain()">전체</span>
      ${regions.map(r => `<span class="fchip${aRegion===r?' on':''}" onclick="aRegion='${r}';renderMain()">${r}</span>`).join('')}
    </div>
    ${(aRegion==='all' ? regions : [aRegion]).map(region => {
      const acts = list.filter(a => a.region === region);
      if (!acts.length) return '';
      return `<div class="section-h">${region}</div>
      <div class="act-grid">
        ${acts.map(a => {
          const s = a.status || '';
          return `<div class="act-card">
            <div class="act-top">
              <div class="act-icon">${a.icon}</div>
              <div class="act-name">${a.name}</div>
              <div class="act-desc">${a.desc}</div>
              ${a.note ? `<div class="act-note">${a.note}</div>` : ''}
            </div>
            <div class="act-bot">
              <span class="act-price">${a.price}</span>
              <button class="status-btn${s==='booked'?' booked':s==='done'?' done':''}" onclick="cycleAct('${a.id}')">${s==='done'?'✓ 완료':s==='booked'?'예약완료':'예약 전'}</button>
              <button class="icon-btn" onclick="showEditActModal('${a.id}')" title="편집">✎</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}`;
}

function cycleAct(id) {
  const a = state.activities.find(x => x.id===id);
  if (!a) return;
  a.status = a.status==='' ? 'booked' : a.status==='booked' ? 'done' : '';
  saveState(); renderMain();
}

function delAct(id) {
  if (!confirm('삭제할까요?')) return;
  state.activities = state.activities.filter(a => a.id!==id);
  saveState(); renderMain();
}

// ━━━ RESTAURANTS ━━━
let rSearch = '', rRegion = 'all';

function renderRestaurants() {
  const regions = [...new Set(state.restaurants.map(r => r.region))];
  const visited = state.restaurants.filter(r => r.visited).length;
  const filtered = state.restaurants.filter(r => {
    const ms = !rSearch || r.name.toLowerCase().includes(rSearch.toLowerCase()) || r.desc.toLowerCase().includes(rSearch.toLowerCase());
    const mr = rRegion==='all' || r.region===rRegion;
    return ms && mr;
  });
  return `
    <div class="stat-row">
      <div class="stat-pill hi"><span class="stat-pill-num">${state.restaurants.length}</span><span class="stat-pill-lbl">총 맛집</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${visited}</span><span class="stat-pill-lbl">방문완료</span></div>
      <div class="stat-pill"><span class="stat-pill-num">${state.restaurants.length-visited}</span><span class="stat-pill-lbl">미방문</span></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" placeholder="맛집 이름, 메뉴 검색…" value="${rSearch.replace(/"/g,'&quot;')}" oninput="rSearch=this.value;renderMain()">
    </div>
    <div class="filter-row">
      <span class="fchip${rRegion==='all'?' on':''}" onclick="rRegion='all';renderMain()">전체</span>
      ${regions.map(r => `<span class="fchip${rRegion===r?' on':''}" onclick="rRegion='${r}';renderMain()">${r}</span>`).join('')}
    </div>
    <div class="note-strip">💡 현금 필수: 야시장·로컬 식당은 현금(베트남 동) 결제. 고수 빼달라고 할 때: <strong>"không ngò"</strong> (콩응오)</div>
    <div class="rest-list" style="margin-top:14px">
      ${filtered.length === 0
        ? '<div class="empty"><div class="empty-icon">🔍</div>검색 결과가 없어요</div>'
        : filtered.map(r => `
        <div class="rest-card">
          <div class="rest-emoji">${r.emoji||'🍴'}</div>
          <div class="rest-body">
            <div class="rest-top">
              <span class="rest-name">${r.name}</span>
              ${r.visited ? '<span class="visited-badge">✓ 방문완료</span>' : ''}
            </div>
            <div class="rest-meta">
              <span class="rest-cat">${r.category}</span>
              <span class="rest-region">${r.region}</span>
            </div>
            <div class="rest-desc">${r.desc}</div>
            ${r.note ? `<div class="rest-note">📝 ${r.note}</div>` : ''}
            <div class="rest-actions">
              <button class="visit-btn${r.visited?' on':''}" onclick="toggleVisited('${r.id}')">${r.visited?'✓ 방문완료':'방문 체크'}</button>
              <button class="text-btn edit" onclick="showEditRestModal('${r.id}')">편집</button>
              <button class="text-btn del" onclick="delRest('${r.id}')">삭제</button>
            </div>
          </div>
        </div>`).join('')}
    </div>`;
}

function toggleVisited(id) {
  const r = state.restaurants.find(x => x.id===id);
  if (r) { r.visited = !r.visited; saveState(); renderMain(); }
}
function delRest(id) {
  if (!confirm('삭제할까요?')) return;
  state.restaurants = state.restaurants.filter(r => r.id!==id);
  saveState(); renderMain();
}

// ━━━ HOTELS ━━━
function renderHotels() {
  return SEED_HOTELS.map(hotel => {
    const doneCnt = hotel.facilities.filter((_,fi) => state.hotelDone && state.hotelDone[hotel.id+'_'+fi]).length;
    return `<div class="hotel-section">
      <div class="hotel-sect-head">
        <span class="hotel-sect-name">${hotel.name}</span>
        <span class="hotel-period">${hotel.period}</span>
        <span class="hotel-progress">${doneCnt}/${hotel.facilities.length}</span>
      </div>
      <div class="hotel-table-wrap">
        <table>
          <thead><tr><th style="width:46px"></th><th>구분</th><th>시설 / 프로그램</th><th>운영시간</th><th>비고</th></tr></thead>
          <tbody>
            ${hotel.facilities.map((f,fi) => {
              const k = hotel.id+'_'+fi;
              const on = !!(state.hotelDone && state.hotelDone[k]);
              return `<tr>
                <td><button class="check-btn${on?' on':''}" onclick="toggleFac('${hotel.id}',${fi})" title="완료 체크">${on?'✓':''}</button></td>
                <td><span class="badge badge-${f.type}">${f.type==='free'?'무료':'유료'}</span></td>
                <td style="font-weight:500">${f.name}</td>
                <td style="color:var(--text3);font-size:12px">${f.hours}</td>
                <td style="color:var(--text3);font-size:12px">${f.note}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="hotel-tip">💡 ${hotel.tip}</div>
    </div>`;
  }).join('');
}

function toggleFac(hid, fi) {
  if (!state.hotelDone) state.hotelDone = {};
  const k = hid+'_'+fi;
  state.hotelDone[k] = !state.hotelDone[k];
  saveState(); renderMain();
}

// ━━━ MODAL ━━━
let mMode = null, mCtx = {};
function showModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('on');
}
function hideModal() { document.getElementById('modalOverlay').classList.remove('on'); }
function closeModal(e) { if (e.target===document.getElementById('modalOverlay')) hideModal(); }

function showAddTLModal(di) {
  mMode='addTL'; mCtx={di};
  showModal('항목 추가', tlForm({time:'',type:'hotel',text:'',tag:'',tagType:''}));
}
function showEditTLModal(di, ii) {
  mMode='editTL'; mCtx={di,ii};
  showModal('항목 편집', tlForm(state.schedule[di].items[ii]));
}
function tlForm(item) {
  return `
    <div class="f-row"><label class="f-label">시간</label>
      <input class="f-inp" id="f-time" value="${item.time||''}" placeholder="09:00"></div>
    <div class="f-row"><label class="f-label">유형</label>
      <select class="f-sel" id="f-type">
        ${['meal','pool','out','hotel','eve'].map(t=>`<option value="${t}"${item.type===t?' selected':''}>${{meal:'🍽 식사',pool:'🏊 풀/비치',out:'🗺 외출/관광',hotel:'🏨 호텔',eve:'🌅 이벤트'}[t]}</option>`).join('')}
      </select></div>
    <div class="f-row"><label class="f-label">내용</label>
      <input class="f-inp" id="f-text" value="${(item.text||'').replace(/"/g,'&quot;')}" placeholder="일정 내용"></div>
    <div class="f-row"><label class="f-label">태그 (선택)</label>
      <input class="f-inp" id="f-tag" value="${item.tag||''}" placeholder="예: 예약 필수"></div>`;
}

function showAddActModal() {
  mMode='addAct'; mCtx={};
  showModal('액티비티 추가', actForm({icon:'🌊',region:'중부 롱비치',name:'',desc:'',price:'',note:''}));
}
function showEditActModal(id) {
  mMode='editAct'; mCtx={id};
  showModal('액티비티 편집', actForm(state.activities.find(x=>x.id===id)));
}
function actForm(a) {
  const regs = ['중부 롱비치','북서부 바이다이','남부 켐 비치'];
  return `
    <div class="f-row"><label class="f-label">아이콘</label><input class="f-inp" id="f-icon" value="${a.icon||'🌊'}"></div>
    <div class="f-row"><label class="f-label">지역</label>
      <select class="f-sel" id="f-region">
        ${regs.map(r=>`<option value="${r}"${a.region===r?' selected':''}>${r}</option>`).join('')}
      </select></div>
    <div class="f-row"><label class="f-label">이름</label><input class="f-inp" id="f-name" value="${(a.name||'').replace(/"/g,'&quot;')}"></div>
    <div class="f-row"><label class="f-label">설명</label><textarea class="f-ta" id="f-desc">${a.desc||''}</textarea></div>
    <div class="f-row"><label class="f-label">가격/시간</label><input class="f-inp" id="f-price" value="${(a.price||'').replace(/"/g,'&quot;')}"></div>
    <div class="f-row"><label class="f-label">메모</label><input class="f-inp" id="f-note" value="${(a.note||'').replace(/"/g,'&quot;')}" placeholder="개인 메모"></div>`;
}

function showAddRestModal() {
  mMode='addRest'; mCtx={};
  showModal('맛집 추가', restForm({emoji:'🍴',name:'',region:'중부 소나시',category:'',desc:'',note:''}));
}
function showEditRestModal(id) {
  mMode='editRest'; mCtx={id};
  showModal('맛집 편집', restForm(state.restaurants.find(x=>x.id===id)));
}
function restForm(r) {
  const regs = ['중부 소나시','북부 그랜드월드','남부 켐 비치'];
  return `
    <div class="f-row"><label class="f-label">이모지</label><input class="f-inp" id="f-emoji" value="${r.emoji||'🍴'}"></div>
    <div class="f-row"><label class="f-label">이름</label><input class="f-inp" id="f-name" value="${(r.name||'').replace(/"/g,'&quot;')}"></div>
    <div class="f-row"><label class="f-label">지역</label>
      <select class="f-sel" id="f-region">
        ${regs.map(rg=>`<option value="${rg}"${r.region===rg?' selected':''}>${rg}</option>`).join('')}
      </select></div>
    <div class="f-row"><label class="f-label">카테고리</label><input class="f-inp" id="f-category" value="${(r.category||'').replace(/"/g,'&quot;')}"></div>
    <div class="f-row"><label class="f-label">설명</label><textarea class="f-ta" id="f-desc">${r.desc||''}</textarea></div>
    <div class="f-row"><label class="f-label">메모</label><input class="f-inp" id="f-note" value="${(r.note||'').replace(/"/g,'&quot;')}" placeholder="개인 메모"></div>`;
}

function saveModal() {
  const g = id => document.getElementById(id)?.value?.trim() || '';
  if (mMode==='addTL' || mMode==='editTL') {
    const item = {time:g('f-time'),type:g('f-type'),text:g('f-text'),tag:g('f-tag'),tagType:g('f-type'),done:false};
    if (!item.text) return alert('내용을 입력해주세요');
    if (mMode==='addTL') state.schedule[mCtx.di].items.push(item);
    else { item.done = state.schedule[mCtx.di].items[mCtx.ii].done; state.schedule[mCtx.di].items[mCtx.ii] = item; }
    saveState(); hideModal(); renderMain();
    requestAnimationFrame(() => { document.getElementById('dc'+mCtx.di)?.classList.add('open'); });
  } else if (mMode==='addAct' || mMode==='editAct') {
    const a = {icon:g('f-icon'),region:g('f-region'),name:g('f-name'),desc:g('f-desc'),price:g('f-price'),note:g('f-note')};
    if (!a.name) return alert('이름을 입력해주세요');
    if (mMode==='addAct') { a.id='a'+Date.now(); a.status=''; state.activities.push(a); }
    else { const i=state.activities.findIndex(x=>x.id===mCtx.id); state.activities[i]={...state.activities[i],...a}; }
    saveState(); hideModal(); renderMain();
  } else if (mMode==='addRest' || mMode==='editRest') {
    const r = {emoji:g('f-emoji'),name:g('f-name'),region:g('f-region'),category:g('f-category'),desc:g('f-desc'),note:g('f-note')};
    if (!r.name) return alert('이름을 입력해주세요');
    if (mMode==='addRest') { r.id='r'+Date.now(); r.visited=false; state.restaurants.push(r); }
    else { const i=state.restaurants.findIndex(x=>x.id===mCtx.id); state.restaurants[i]={...state.restaurants[i],...r}; }
    saveState(); hideModal(); renderMain();
  }
}

// ━━━ DDAY ━━━
function initDday() {
  const departure = new Date('2026-07-24T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.ceil((departure - today) / (1000 * 60 * 60 * 24));

  let text, cls;
  if (diff > 0)      { text = `D-${diff}`;          cls = ''; }
  else if (diff === 0) { text = 'D-Day! 🛫';         cls = 'today'; }
  else               { text = `D+${Math.abs(diff)}`; cls = 'past'; }

  const nav = document.getElementById('navDday');
  if (nav) { nav.textContent = text; nav.className = 'dday-badge ' + cls; }

  const strip = document.getElementById('stripDday');
  if (strip) { strip.textContent = text; }
}

// ━━━ INIT ━━━
loadState();
renderMain();
loadFromServer();
initDday();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>푸꾸옥 여행 2025</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ocean:#1A4A5C; --ocean-light:#2D6B82; --ocean-pale:#E8F4F8;
  --coral:#D4614A; --coral-light:#F0A090;
  --gold:#B8860B; --gold-light:#F5D06A;
  --sand:#F5EDD8; --sand-dark:#E8D9BA;
  --text:#1C1C1C; --text2:#4A4A4A; --text3:#7A7A7A;
  --bg:#FDFAF5; --card:#FFFFFF;
  --green:#166034; --green-bg:#E1F5EC;
  --blue:#0F4F7A; --blue-bg:#DEEEF9;
  --amber:#7A5B00; --amber-bg:#FFF8E0;
  --font:'DM Sans',sans-serif;
  --serif:'Cormorant Garamond',serif;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(253,250,245,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--sand-dark);}
.nav-inner{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;max-width:1100px;margin:0 auto;}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-logo{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ocean);flex-shrink:0;margin-right:6px;}
.nb{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--sand-dark);font-size:12px;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;white-space:nowrap;font-family:var(--font);}
.nb.on{background:var(--ocean);color:#fff;border-color:var(--ocean);}
.nb:hover:not(.on){background:var(--sand);}
#syncStatus{margin-left:auto;font-size:13px;flex-shrink:0;opacity:.7;cursor:default;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 100px;}
.panel{display:none;}.panel.on{display:block;}

/* SEC */
.sec{margin-bottom:22px;}
.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:11px;}

/* DAY CARDS */
.day-card{border:1px solid var(--sand-dark);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;}
.day-top{display:flex;align-items:center;gap:12px;padding:13px 18px;background:var(--sand);cursor:pointer;user-select:none;}
.day-num{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--ocean);min-width:110px;}
.day-ttl{flex:1;font-size:14px;font-weight:500;}
.day-badge{font-size:11px;background:var(--ocean);color:#fff;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.day-arr{font-size:12px;color:var(--text3);transition:transform .2s;}
.day-card.open .day-arr{transform:rotate(180deg);}
.day-body{display:none;padding:12px 16px 16px;}
.day-card.open .day-body{display:block;}

/* TIMELINE */
.tl{display:flex;flex-direction:column;gap:6px;}
.tl-row{display:flex;gap:10px;align-items:flex-start;padding:4px 6px;border-radius:8px;cursor:pointer;transition:background .1s;}
.tl-row:hover{background:var(--ocean-pale);}
.tl-row.done .tl-c{text-decoration:line-through;opacity:.45;}
.tl-row.done .tl-dot{opacity:.25;}
.tl-t{font-size:12px;color:var(--text3);min-width:42px;padding-top:3px;font-variant-numeric:tabular-nums;}
.tl-dot-w{display:flex;flex-direction:column;align-items:center;padding-top:6px;}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tl-line{width:1px;background:var(--sand-dark);flex:1;min-height:14px;}
.tl-c{font-size:13px;flex:1;line-height:1.5;}
.tl-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s;}
.tl-row:hover .tl-actions{opacity:1;}
.tl-act-btn{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--sand-dark);background:var(--card);cursor:pointer;color:var(--text2);}
.tl-act-btn:hover{background:var(--sand);}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;margin-left:4px;vertical-align:middle;font-weight:500;}
.t-meal{background:#E1F5EC;color:#166034;} .t-pool{background:#DEEEF9;color:#0F4F7A;}
.t-out{background:#FEF0ED;color:#9A3020;} .t-hotel{background:var(--ocean-pale);color:#0F3A4E;}
.t-eve{background:var(--amber-bg);color:var(--amber);}
.d-meal{background:#27A060;} .d-pool{background:#1A6EA0;}
.d-out{background:var(--coral);} .d-hotel{background:var(--ocean);}
.d-eve{background:var(--gold);}
.tl-add-btn{margin-top:8px;font-size:12px;padding:5px 14px;border-radius:20px;border:1px dashed var(--sand-dark);background:transparent;cursor:pointer;color:var(--text3);}
.tl-add-btn:hover{background:var(--sand);color:var(--ocean);}

/* ACTIVITY GRID */
.region-heading{font-family:var(--serif);font-size:1.4rem;font-weight:400;color:var(--ocean);margin:1.8rem 0 1rem;}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:1.5rem;}
.act-card{background:var(--card);border:1px solid var(--sand-dark);border-radius:var(--radius);padding:1.1rem;transition:box-shadow .2s;}
.act-card:hover{box-shadow:0 6px 24px rgba(26,74,92,.1);}
.act-icon{font-size:26px;margin-bottom:8px;}
.act-name{font-weight:600;font-size:14px;color:var(--ocean);margin-bottom:4px;}
.act-desc{font-size:12.5px;color:var(--text2);line-height:1.5;}
.act-price{font-size:11.5px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--sand);}
.act-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:6px;}
.act-status{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;cursor:pointer;border:none;font-family:var(--font);background:var(--sand-dark);color:var(--text3);transition:all .15s;}
.act-status.booked{background:var(--blue-bg);color:var(--blue);}
.act-status.done{background:var(--green-bg);color:var(--green);}
.act-edit-btn{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--sand-dark);background:transparent;cursor:pointer;color:var(--text2);}
.act-edit-btn:hover{background:var(--sand);}

/* RESTAURANT */
.r-search-bar{margin-bottom:10px;}
.r-search-input{width:100%;padding:9px 14px;border:1px solid var(--sand-dark);border-radius:10px;font-size:13px;background:var(--card);font-family:var(--font);outline:none;}
.r-search-input:focus{border-color:var(--ocean-light);}
.r-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.r-filter{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--sand-dark);cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;}
.r-filter.on{background:var(--ocean);color:#fff;border-color:var(--ocean);}
.r-grid{display:flex;flex-direction:column;gap:12px;}
.r-card{background:var(--card);border:1px solid var(--sand-dark);border-radius:var(--radius);padding:1.1rem;}
.r-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;}
.r-emoji{font-size:24px;}
.r-name{font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px;}
.r-cat{font-size:11.5px;color:var(--coral);margin-bottom:2px;}
.r-region{font-size:11px;background:var(--ocean-pale);color:var(--ocean);padding:2px 8px;border-radius:10px;display:inline-block;}
.r-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-top:6px;}
.r-note{font-size:12px;color:var(--text3);margin-top:4px;font-style:italic;}
.r-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.visit-btn{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--sand-dark);background:transparent;cursor:pointer;color:var(--text2);font-family:var(--font);}
.visit-btn.on{background:var(--green-bg);color:var(--green);border-color:var(--green);}
.visit-btn:hover:not(.on){background:var(--sand);}
.r-edit-btn,.r-del-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--sand-dark);background:transparent;cursor:pointer;font-family:var(--font);}
.r-edit-btn{color:var(--ocean);}
.r-del-btn{color:var(--coral);}
.r-edit-btn:hover{background:var(--ocean-pale);}
.r-del-btn:hover{background:#FEF0ED;}
.r-visited-badge{font-size:10px;background:var(--green-bg);color:var(--green);padding:2px 8px;border-radius:10px;font-weight:600;}

/* HOTEL FACILITIES */
.hotel-block{margin-bottom:2.5rem;}
.hotel-header{display:flex;align-items:baseline;gap:14px;margin-bottom:1rem;flex-wrap:wrap;}
.hotel-name-h{font-family:var(--serif);font-size:1.8rem;font-weight:400;color:var(--ocean);}
.hotel-period{font-size:11px;background:var(--ocean);color:#fff;padding:3px 12px;border-radius:20px;}
.table-card{background:var(--card);border:1px solid var(--sand-dark);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--ocean);color:rgba(255,255,255,.8);font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;text-align:left;}
td{padding:10px 14px;border-bottom:1px solid var(--sand);font-size:13px;vertical-align:middle;line-height:1.5;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(232,244,248,.35);}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:2px 9px;border-radius:20px;}
.badge-free{background:var(--ocean-pale);color:var(--ocean);}
.badge-paid{background:#FEF0ED;color:#A0441C;}
.fac-done{width:32px;text-align:center;cursor:pointer;font-size:16px;user-select:none;transition:color .15s;}
.fac-done.on{color:var(--green);}
.tip-box{background:var(--ocean-pale);border-left:3px solid var(--ocean);padding:10px 14px;font-size:12.5px;color:var(--ocean);margin-top:10px;border-radius:0 8px 8px 0;line-height:1.5;}

/* NOTE BOX */
.note-box{background:#FFFBF0;border:1px solid var(--gold-light);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--gold);line-height:1.6;margin-top:1.2rem;}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--ocean);color:#fff;font-size:24px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(26,74,92,.35);z-index:90;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.fab:hover{background:var(--ocean-light);}
.fab.hidden{display:none;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.on{display:flex;}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:600;color:var(--ocean);}
.modal-close{font-size:20px;cursor:pointer;color:var(--text3);background:none;border:none;line-height:1;}
.modal-body{padding:16px 20px;}
.form-row{margin-bottom:14px;}
.form-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block;}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--sand-dark);border-radius:10px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--ocean-light);}
.form-textarea{resize:vertical;min-height:80px;}
.modal-footer{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;}
.btn-cancel{padding:8px 18px;border-radius:20px;border:1px solid var(--sand-dark);background:transparent;cursor:pointer;font-size:13px;font-family:var(--font);}
.btn-save{padding:8px 18px;border-radius:20px;border:none;background:var(--ocean);color:#fff;cursor:pointer;font-size:13px;font-family:var(--font);}
.btn-save:hover{background:var(--ocean-light);}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;}

/* STAT BAR */
.stat-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.stat-item{background:var(--card);border:1px solid var(--sand-dark);border-radius:12px;padding:10px 16px;min-width:100px;}
.stat-val{font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--ocean);}
.stat-lbl{font-size:11px;color:var(--text3);}

@media(max-width:600px){
  .act-grid{grid-template-columns:1fr 1fr;}
  table{font-size:12px;}th,td{padding:8px 10px;}
}
</style>
</head>

// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
const DATA_VERSION = 1;
const SERVER_URL = 'https://osaka-trip-server.onrender.com';
let state = {};

function getDefaultState() {
  return {
    version: DATA_VERSION,
    schedule: SEED_SCHEDULE.map(d => ({...d, items: d.items.map(i => ({...i, done: false}))})),
    activities: JSON.parse(JSON.stringify(SEED_ACTIVITIES)),
    restaurants: JSON.parse(JSON.stringify(SEED_RESTAURANTS)),
    hotelDone: {},
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem('phuquoc2025');
    if (saved) { state = JSON.parse(saved); return; }
  } catch(e) {}
  state = getDefaultState();
}

function saveState() {
  localStorage.setItem('phuquoc2025', JSON.stringify(state));
  syncToServer();
}

// ──────────────────────────────────────────────
// SYNC
// ──────────────────────────────────────────────
let _syncTimer = null;
function setSyncStatus(s) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = {idle:'', syncing:'🔄', ok:'☁️', error:'⚠️'};
  const tip = {idle:'', syncing:'저장 중…', ok:'서버 동기화됨', error:'서버 저장 실패 (로컬 저장됨)'};
  el.textContent = map[s] || '';
  el.title = tip[s] || '';
}
function syncToServer() {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    setSyncStatus('syncing');
    try {
      const res = await fetch(`${SERVER_URL}/phuquoc/state`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state),
      });
      setSyncStatus(res.ok ? 'ok' : 'error');
    } catch(e) { setSyncStatus('error'); }
  }, 800);
}
async function loadFromServer() {
  try {
    const res = await fetch(`${SERVER_URL}/phuquoc/state`);
    if (!res.ok) return;
    const sv = await res.json();
    if (!sv || !sv.version) return;
    state = sv;
    localStorage.setItem('phuquoc2025', JSON.stringify(state));
    renderMain();
    setSyncStatus('ok');
  } catch(e) {}
}

// ──────────────────────────────────────────────
// TABS
// ──────────────────────────────────────────────
let activeTab = 'schedule';
function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.textContent.includes(
    id==='schedule'?'일정표':id==='activities'?'액티비티':id==='restaurants'?'맛집':'호텔'
  )));
  const fab = document.getElementById('fab');
  fab.classList.toggle('hidden', id === 'hotels');
  renderMain();
}
function handleFab() {
  if (activeTab === 'schedule') showAddTimelineModal(0);
  else if (activeTab === 'activities') showAddActivityModal();
  else if (activeTab === 'restaurants') showAddRestaurantModal();
}
function renderMain() {
  const main = document.getElementById('main');
  if (activeTab === 'schedule') main.innerHTML = renderSchedule();
  else if (activeTab === 'activities') main.innerHTML = renderActivities();
  else if (activeTab === 'restaurants') main.innerHTML = renderRestaurants();
  else if (activeTab === 'hotels') main.innerHTML = renderHotels();
}

// ──────────────────────────────────────────────
// SCHEDULE
// ──────────────────────────────────────────────
function renderSchedule() {
  const doneCount = state.schedule.reduce((acc, d) => acc + d.items.filter(i => i.done).length, 0);
  const totalCount = state.schedule.reduce((acc, d) => acc + d.items.length, 0);
  return `
  <div class="stat-bar">
    <div class="stat-item"><div class="stat-val">${state.schedule.length}</div><div class="stat-lbl">총 일수</div></div>
    <div class="stat-item"><div class="stat-val">${doneCount}</div><div class="stat-lbl">완료 항목</div></div>
    <div class="stat-item"><div class="stat-val">${totalCount}</div><div class="stat-lbl">전체 항목</div></div>
  </div>
  <div class="note-box">⚡ 사전 예약 필수: INK 360 선셋 좌석 / 4섬 호핑투어 / 빈펄 사파리+빈원더스 / 혼똔섬 케이블카 / 각 리조트 스파</div>
  <div style="margin-top:16px">
    ${state.schedule.map((day, di) => `
    <div class="day-card" id="daycard-${di}">
      <div class="day-top" onclick="toggleDay(${di})">
        <span class="day-num">${day.d}</span>
        <span class="day-ttl">${day.title}</span>
        <span class="day-badge">${day.hotel}</span>
        <span class="day-arr">▼</span>
      </div>
      <div class="day-body">
        <div class="tl">
          ${day.items.map((item, ii) => renderTLItem(di, item, ii)).join('')}
        </div>
        <button class="tl-add-btn" onclick="showAddTimelineModal(${di})">＋ 항목 추가</button>
      </div>
    </div>`).join('')}
  </div>`;
}

function toggleDay(di) {
  document.getElementById('daycard-' + di).classList.toggle('open');
}

const DOT_CLASS = {meal:'d-meal',pool:'d-pool',out:'d-out',hotel:'d-hotel',eve:'d-eve'};
const TAG_CLASS = {meal:'t-meal',pool:'t-pool',out:'t-out',hotel:'t-hotel',eve:'t-eve'};

function renderTLItem(di, item, ii) {
  const isLast = ii === state.schedule[di].items.length - 1;
  const tagHtml = item.tag ? `<span class="tag ${TAG_CLASS[item.tagType]||TAG_CLASS[item.type]||'t-hotel'}">${item.tag}</span>` : '';
  return `<div class="tl-row${item.done?' done':''}" onclick="toggleTLDone(${di},${ii})">
    <span class="tl-t">${item.time}</span>
    <div class="tl-dot-w">
      <span class="tl-dot ${DOT_CLASS[item.type]||'d-hotel'}"></span>
      ${!isLast?'<div class="tl-line"></div>':''}
    </div>
    <span class="tl-c">${item.text}${tagHtml}</span>
    <div class="tl-actions">
      <button class="tl-act-btn" onclick="event.stopPropagation();showEditTLModal(${di},${ii})">✎</button>
      <button class="tl-act-btn" onclick="event.stopPropagation();deleteTLItem(${di},${ii})">✕</button>
    </div>
  </div>`;
}

function toggleTLDone(di, ii) {
  state.schedule[di].items[ii].done = !state.schedule[di].items[ii].done;
  saveState();
  renderMain();
  document.getElementById('daycard-' + di)?.classList.add('open');
}

function deleteTLItem(di, ii) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  state.schedule[di].items.splice(ii, 1);
  saveState(); renderMain();
  document.getElementById('daycard-' + di)?.classList.add('open');
}

// ──────────────────────────────────────────────
// ACTIVITIES
// ──────────────────────────────────────────────
let aFilterRegion = 'all';
function renderActivities() {
  const regions = [...new Set(state.activities.map(a => a.region))];
  const filtered = aFilterRegion === 'all' ? state.activities : state.activities.filter(a => a.region === aFilterRegion);
  const booked = state.activities.filter(a => a.status === 'booked').length;
  const done = state.activities.filter(a => a.status === 'done').length;
  return `
  <div class="stat-bar">
    <div class="stat-item"><div class="stat-val">${state.activities.length}</div><div class="stat-lbl">총 액티비티</div></div>
    <div class="stat-item"><div class="stat-val">${booked}</div><div class="stat-lbl">예약완료</div></div>
    <div class="stat-item"><div class="stat-val">${done}</div><div class="stat-lbl">완료</div></div>
  </div>
  <div class="r-filters">
    <span class="r-filter${aFilterRegion==='all'?' on':''}" onclick="aFilterRegion='all';renderMain()">전체</span>
    ${regions.map(r => `<span class="r-filter${aFilterRegion===r?' on':''}" onclick="aFilterRegion='${r}';renderMain()">${r}</span>`).join('')}
  </div>
  ${filtered.length === 0 ? '<div class="empty-state">액티비티가 없어요</div>' : ''}
  ${regions.filter(r => aFilterRegion==='all' || aFilterRegion===r).map(region => {
    const acts = filtered.filter(a => a.region === region);
    if (!acts.length) return '';
    return `<div class="region-heading">${region}</div>
    <div class="act-grid">${acts.map(a => renderActCard(a)).join('')}</div>`;
  }).join('')}`;
}

function renderActCard(a) {
  const s = a.status || '';
  return `<div class="act-card">
    <div class="act-icon">${a.icon}</div>
    <div class="act-name">${a.name}</div>
    <div class="act-desc">${a.desc}</div>
    <div class="act-price">${a.price}</div>
    ${a.note ? `<div style="font-size:11.5px;color:var(--text3);margin-top:4px;font-style:italic">${a.note}</div>` : ''}
    <div class="act-footer">
      <button class="act-status${s==='booked'?' booked':s==='done'?' done':''}" onclick="cycleActStatus('${a.id}')">${s==='done'?'✓ 완료':s==='booked'?'예약완료':'예약 전'}</button>
      <button class="act-edit-btn" onclick="showEditActivityModal('${a.id}')">편집</button>
    </div>
  </div>`;
}

function cycleActStatus(id) {
  const a = state.activities.find(x => x.id === id);
  if (!a) return;
  a.status = a.status === '' ? 'booked' : a.status === 'booked' ? 'done' : '';
  saveState(); renderMain();
}

function deleteActivity(id) {
  if (!confirm('이 액티비티를 삭제할까요?')) return;
  state.activities = state.activities.filter(a => a.id !== id);
  saveState(); renderMain();
}

// ──────────────────────────────────────────────
// RESTAURANTS
// ──────────────────────────────────────────────
let rSearch = '', rFilterRegion = 'all';
function renderRestaurants() {
  const regions = [...new Set(state.restaurants.map(r => r.region))];
  const filtered = state.restaurants.filter(r => {
    const matchSearch = !rSearch || r.name.toLowerCase().includes(rSearch.toLowerCase()) || r.desc.toLowerCase().includes(rSearch.toLowerCase());
    const matchRegion = rFilterRegion === 'all' || r.region === rFilterRegion;
    return matchSearch && matchRegion;
  });
  const visited = state.restaurants.filter(r => r.visited).length;
  return `
  <div class="stat-bar">
    <div class="stat-item"><div class="stat-val">${state.restaurants.length}</div><div class="stat-lbl">총 맛집</div></div>
    <div class="stat-item"><div class="stat-val">${visited}</div><div class="stat-lbl">방문완료</div></div>
  </div>
  <div class="r-search-bar">
    <input class="r-search-input" placeholder="🔍 맛집 이름, 메뉴 검색..." value="${rSearch}" oninput="rSearch=this.value;renderMain()">
  </div>
  <div class="r-filters">
    <span class="r-filter${rFilterRegion==='all'?' on':''}" onclick="rFilterRegion='all';renderMain()">전체</span>
    ${regions.map(r => `<span class="r-filter${rFilterRegion===r?' on':''}" onclick="rFilterRegion='${r}';renderMain()">${r}</span>`).join('')}
  </div>
  <div class="note-box">💡 현금 필수: 야시장·로컬 식당은 현금(베트남 동) 결제만 가능. 고수 빼달라고 할 때: "không ngò" (콩응오)</div>
  <div class="r-grid" style="margin-top:14px">
    ${filtered.length === 0 ? '<div class="empty-state">검색 결과가 없어요</div>' : filtered.map(r => renderRestCard(r)).join('')}
  </div>`;
}

function renderRestCard(r) {
  return `<div class="r-card">
    <div class="r-head">
      <div class="r-emoji">${r.emoji||'🍴'}</div>
      <div>
        <div class="r-name">${r.name} ${r.visited?'<span class="r-visited-badge">✓ 방문완료</span>':''}</div>
        <div class="r-cat">${r.category}</div>
        <span class="r-region">${r.region}</span>
      </div>
    </div>
    <div class="r-desc">${r.desc}</div>
    ${r.note ? `<div class="r-note">📝 ${r.note}</div>` : ''}
    <div class="r-actions">
      <button class="visit-btn${r.visited?' on':''}" onclick="toggleVisited('${r.id}')">${r.visited?'✓ 방문완료':'방문 체크'}</button>
      <button class="r-edit-btn" onclick="showEditRestModal('${r.id}')">편집</button>
      <button class="r-del-btn" onclick="deleteRest('${r.id}')">삭제</button>
    </div>
  </div>`;
}

function toggleVisited(id) {
  const r = state.restaurants.find(x => x.id === id);
  if (r) { r.visited = !r.visited; saveState(); renderMain(); }
}
function deleteRest(id) {
  if (!confirm('이 맛집을 삭제할까요?')) return;
  state.restaurants = state.restaurants.filter(r => r.id !== id);
  saveState(); renderMain();
}

function renderHotels() {
  return SEED_HOTELS.map(hotel => `
  <div class="hotel-block">
    <div class="hotel-header">
      <span class="hotel-name-h">${hotel.name}</span>
      <span class="hotel-period">${hotel.period}</span>

      <table>
        <tr><th>완료</th><th>구분</th><th>시설 / 프로그램</th><th>운영시간</th><th>비고</th></tr>
        ${hotel.facilities.map((f, fi) => {
          const key = hotel.id + '_' + fi;
          const done = !!(state.hotelDone && state.hotelDone[key]);
          return `<tr>
            <td class="fac-done${done?' on':''}" onclick="toggleFacDone('${hotel.id}',${fi})" title="완료 체크">${done?'✓':'○'}</td>
            <td><span class="badge badge-${f.type}">${f.type==='free'?'무료':'유료'}</span></td>

            <td style="color:var(--text3)">${f.note}</td>
          </tr>`;
        }).join('')}
      </table>
    </div>
    <div class="tip-box">💡 ${hotel.tip}</div>
  </div>`).join('');
}

function toggleFacDone(hotelId, fi) {
  if (!state.hotelDone) state.hotelDone = {};
  const key = hotelId + '_' + fi;
  state.hotelDone[key] = !state.hotelDone[key];
  saveState(); renderMain();
}

function hideModal() { document.getElementById('modalOverlay').classList.remove('on'); }
function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) hideModal(); }

function showAddTimelineModal(di) {
  modalMode = 'addTL'; modalCtx = { di };
  showModal('항목 추가', tlForm({time:'',type:'hotel',text:'',tag:'',tagType:''}));
}
function showEditTLModal(di, ii) {
  modalMode = 'editTL'; modalCtx = { di, ii };
  showModal('항목 편집', tlForm(state.schedule[di].items[ii]));
}
function tlForm(item) {

      ${['meal','pool','out','hotel','eve'].map(t => `<option value="${t}"${item.type===t?' selected':''}>${{meal:'🍽 식사',pool:'🏊 풀/비치',out:'🗺 외출/관광',hotel:'🏨 호텔',eve:'🌅 이벤트'}[t]}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="form-label">내용</label>
    <input class="form-input" id="f-text" value="${(item.text||'').replace(/"/g,'&quot;')}" placeholder="일정 내용">
  </div>
  <div class="form-row"><label class="form-label">태그 (선택)</label>
    <input class="form-input" id="f-tag" value="${item.tag||''}" placeholder="예: 예약 필수">
  </div>`;
}

// ─── Activity Modal ───
function showAddActivityModal() {
  modalMode = 'addAct'; modalCtx = {};
  showModal('액티비티 추가', actForm({icon:'🌊',region:'중부 롱비치',name:'',desc:'',price:'',note:''}));
}
function showEditActivityModal(id) {
  modalMode = 'editAct'; modalCtx = { id };
  const a = state.activities.find(x => x.id === id);
  showModal('액티비티 편집', actForm(a));
}
function actForm(a) {
  const regions = ['중부 롱비치','북서부 바이다이','남부 켐 비치'];
  return `
  <div class="form-row"><label class="form-label">아이콘</label>
    <input class="form-input" id="f-icon" value="${a.icon||'🌊'}">
  </div>
  <div class="form-row"><label class="form-label">지역</label>
    <select class="form-select" id="f-region">
      ${regions.map(r => `<option value="${r}"${a.region===r?' selected':''}>${r}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="form-label">이름</label>
    <input class="form-input" id="f-name" value="${(a.name||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">설명</label>
    <textarea class="form-textarea" id="f-desc">${a.desc||''}</textarea>
  </div>
  <div class="form-row"><label class="form-label">가격/시간</label>
    <input class="form-input" id="f-price" value="${(a.price||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">메모</label>
    <input class="form-input" id="f-note" value="${(a.note||'').replace(/"/g,'&quot;')}" placeholder="개인 메모">
  </div>`;
}

// ─── Restaurant Modal ───
function showAddRestModal() {
  modalMode = 'addRest'; modalCtx = {};
  showModal('맛집 추가', restForm({emoji:'🍴',name:'',region:'중부 소나시',category:'',desc:'',note:''}));
}
function showAddRestaurantModal() { showAddRestModal(); }
function showEditRestModal(id) {
  modalMode = 'editRest'; modalCtx = { id };
  const r = state.restaurants.find(x => x.id === id);
  showModal('맛집 편집', restForm(r));
}
function restForm(r) {
  const regions = ['중부 소나시','북부 그랜드월드','남부 켐 비치'];
  return `
  <div class="form-row"><label class="form-label">이모지</label>
    <input class="form-input" id="f-emoji" value="${r.emoji||'🍴'}">
  </div>
  <div class="form-row"><label class="form-label">이름</label>
    <input class="form-input" id="f-name" value="${(r.name||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">지역</label>
    <select class="form-select" id="f-region">
      ${regions.map(rg => `<option value="${rg}"${r.region===rg?' selected':''}>${rg}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="form-label">카테고리</label>
    <input class="form-input" id="f-category" value="${(r.category||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">설명</label>
    <textarea class="form-textarea" id="f-desc">${r.desc||''}</textarea>
  </div>
  <div class="form-row"><label class="form-label">메모</label>
    <input class="form-input" id="f-note" value="${(r.note||'').replace(/"/g,'&quot;')}" placeholder="개인 메모">
  </div>`;
}

// ─── Save Modal ───
function saveModal() {
  const g = id => document.getElementById(id)?.value?.trim() || '';
  if (modalMode === 'addTL' || modalMode === 'editTL') {
    const item = { time:g('f-time'), type:g('f-type'), text:g('f-text'), tag:g('f-tag'), tagType:g('f-type'), done: false };
    if (!item.text) return alert('내용을 입력해주세요');
    if (modalMode === 'addTL') {
      state.schedule[modalCtx.di].items.push(item);
    } else {
      item.done = state.schedule[modalCtx.di].items[modalCtx.ii].done;
      state.schedule[modalCtx.di].items[modalCtx.ii] = item;
    }
    saveState(); hideModal(); renderMain();
    document.getElementById('daycard-' + modalCtx.di)?.classList.add('open');
  } else if (modalMode === 'addAct' || modalMode === 'editAct') {
    const a = { icon:g('f-icon'), region:g('f-region'), name:g('f-name'), desc:g('f-desc'), price:g('f-price'), note:g('f-note') };
    if (!a.name) return alert('이름을 입력해주세요');
    if (modalMode === 'addAct') {
      a.id = 'a' + Date.now(); a.status = '';
      state.activities.push(a);
    } else {
      const idx = state.activities.findIndex(x => x.id === modalCtx.id);
      state.activities[idx] = { ...state.activities[idx], ...a };
    }
    saveState(); hideModal(); renderMain();
  } else if (modalMode === 'addRest' || modalMode === 'editRest') {
    const r = { emoji:g('f-emoji'), name:g('f-name'), region:g('f-region'), category:g('f-category'), desc:g('f-desc'), note:g('f-note') };
    if (!r.name) return alert('이름을 입력해주세요');
    if (modalMode === 'addRest') {
      r.id = 'r' + Date.now(); r.visited = false;
      state.restaurants.push(r);
    } else {
      const idx = state.restaurants.findIndex(x => x.id === modalCtx.id);
      state.restaurants[idx] = { ...state.restaurants[idx], ...r };
    }
    saveState(); hideModal(); renderMain();
  }
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
loadState();
renderMain();
loadFromServer();
</script>

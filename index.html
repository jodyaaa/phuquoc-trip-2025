<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phú Quốc · 가족여행 2025</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Core palette */
  --ink:   #0C1F2C;
  --ocean: #1A4A5C;
  --sea:   #2D6B82;
  --foam:  #E8F4F8;
  --coral: #D4614A;
  --gold:  #C49A2A;
  --sand:  #F5EDD8;
  --sand2: #EDE0C4;
  --cream: #FBF8F3;
  --white: #FFFFFF;
  --mist:  #F0EBE1;
  --text:  #1C1C1C;
  --text2: #4A4840;
  --text3: #8A847A;
  --green:     #166034;
  --green-bg:  #E1F5EC;
  --blue-dark: #0F4F7A;
  --blue-bg:   #DEEEF9;
  --amber:     #7A5B00;
  --amber-bg:  #FFF8E0;
  /* Type */
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'Plus Jakarta Sans', system-ui, sans-serif;
  --r: 12px;
  --r-lg: 20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--cream); color: var(--text); line-height: 1.6; -webkit-tap-highlight-color: transparent; }

/* ───── HEADER ───── */
.site-header {
  background: var(--ink);
  padding: 0 24px;
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: stretch; gap: 0;
}
.header-brand {
  display: flex; flex-direction: column; justify-content: center;
  padding: 14px 24px 14px 0;
  border-right: 1px solid rgba(255,255,255,.1);
  flex-shrink: 0;
}
.brand-name {
  font-family: var(--serif); font-size: 1.25rem; font-weight: 600;
  color: var(--white); letter-spacing: -0.01em; line-height: 1;
}
.brand-name em { font-style: italic; color: #F5D06A; }
.brand-dates {
  font-size: 10px; font-weight: 500; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.4);
  margin-top: 3px;
}
.header-tabs {
  display: flex; align-items: stretch; overflow-x: auto;
  scrollbar-width: none; flex: 1;
}
.header-tabs::-webkit-scrollbar { display: none; }
.htab {
  display: flex; align-items: center; gap: 7px;
  padding: 0 18px; font-size: 12.5px; font-weight: 500;
  color: rgba(255,255,255,.45); cursor: pointer; border: none;
  background: none; white-space: nowrap; font-family: var(--sans);
  border-bottom: 2px solid transparent; transition: all .2s;
  position: relative;
}
.htab:hover { color: rgba(255,255,255,.75); }
.htab.on { color: #F5D06A; border-bottom-color: #F5D06A; }
.htab-icon { font-size: 14px; }
.header-right {
  display: flex; align-items: center; padding: 0 0 0 16px;
  margin-left: auto; flex-shrink: 0;
}
#syncStatus { font-size: 12px; color: rgba(255,255,255,.4); cursor: default; }

/* ───── TRIP STRIP ───── */
.trip-strip {
  background: var(--ocean);
  padding: 10px 24px;
}
.trip-strip-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.ts-item { display: flex; flex-direction: column; }
.ts-label { font-size: 9px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.4); }
.ts-value { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 500; }
.ts-sep { width: 1px; height: 28px; background: rgba(255,255,255,.15); flex-shrink:0; }

/* ───── MAIN ───── */
.main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 100px; }

/* ───── STAT ROW ───── */
.stat-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr));
  gap: 10px; margin-bottom: 24px;
}
.stat-card {
  background: var(--white); border: 1px solid var(--sand2);
  border-radius: var(--r-lg); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 2px;
}
.stat-num {
  font-family: var(--serif); font-size: 2rem; font-weight: 600;
  color: var(--ocean); line-height: 1;
}
.stat-lbl { font-size: 11px; color: var(--text3); font-weight: 500; margin-top:2px; }
.stat-card.accent { background: var(--ocean); border-color: var(--ocean); }
.stat-card.accent .stat-num { color: var(--white); }
.stat-card.accent .stat-lbl { color: rgba(255,255,255,.5); }

/* ───── SECTION LABEL ───── */
.sec-label {
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 14px; padding-left: 2px;
}

/* ───── NOTE BOX ───── */
.note-box {
  background: #FFFBF0; border-left: 3px solid var(--gold);
  border-radius: 0 var(--r) var(--r) 0;
  padding: 12px 16px; font-size: 12.5px; color: var(--amber);
  line-height: 1.6; margin-bottom: 20px;
}

/* ───── DAY CARDS ───── */
.days-wrap { display: flex; flex-direction: column; gap: 8px; }
.day-card {
  background: var(--white); border: 1px solid var(--sand2);
  border-radius: var(--r-lg); overflow: hidden;
  transition: box-shadow .2s;
}
.day-card:hover { box-shadow: 0 4px 20px rgba(12,31,44,.08); }
.day-top {
  display: flex; align-items: center; gap: 0;
  cursor: pointer; user-select: none;
}
.day-date-col {
  width: 90px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 16px 10px;
  background: var(--ocean); color: var(--white);
  border-radius: 0;
}
.day-d {
  font-family: var(--serif); font-size: 1.1rem; font-weight: 700;
  line-height: 1; color: #F5D06A;
}
.day-date-sm { font-size: 9.5px; opacity: .6; margin-top: 2px; font-weight: 500; letter-spacing:.04em; }
.day-content { flex: 1; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
.day-ttl { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
.day-hotel-badge {
  font-size: 10.5px; font-weight: 500; padding: 4px 11px; border-radius: 20px;
  background: var(--foam); color: var(--ocean); white-space: nowrap; flex-shrink:0;
}
.day-meta { font-size: 12px; color: var(--text3); }
.day-arr { font-size: 11px; color: var(--text3); padding: 0 18px 0 0; transition: transform .2s; flex-shrink:0; }
.day-card.open .day-arr { transform: rotate(180deg); }
.day-body { display: none; padding: 14px 18px 18px 18px; border-top: 1px solid var(--mist); }
.day-card.open .day-body { display: block; }

/* ───── TIMELINE ───── */
.tl { display: flex; flex-direction: column; position: relative; }
.tl::before {
  content: ''; position: absolute; left: 54px; top: 8px; bottom: 8px;
  width: 1px; background: var(--sand2);
}
.tl-row {
  display: flex; gap: 0; align-items: flex-start;
  padding: 5px 4px; border-radius: 8px; cursor: pointer;
  transition: background .1s; position: relative;
}
.tl-row:hover { background: var(--mist); }
.tl-row.done .tl-text { text-decoration: line-through; opacity: .4; }
.tl-row.done .tl-dot { background: var(--sand2) !important; }
.tl-time {
  width: 46px; font-size: 11px; color: var(--text3); flex-shrink: 0;
  padding-top: 4px; font-variant-numeric: tabular-nums; text-align: right;
  padding-right: 8px;
}
.tl-dot-col {
  width: 16px; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; padding-top: 6px; z-index: 1;
}
.tl-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.tl-body { flex: 1; padding: 2px 0 2px 10px; display: flex; align-items: center; gap: 8px; }
.tl-text { font-size: 13px; line-height: 1.5; flex: 1; }
.tl-tag {
  display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 10px;
  margin-left: 4px; vertical-align: middle; font-weight: 500; flex-shrink:0;
}
.tl-actions {
  display: flex; gap: 3px; opacity: 0; transition: opacity .15s; flex-shrink:0;
}
.tl-row:hover .tl-actions { opacity: 1; }
.tl-act-btn {
  font-size: 11px; padding: 2px 7px; border-radius: 6px;
  border: 1px solid var(--sand2); background: var(--white); cursor: pointer; color: var(--text3);
}
.tl-act-btn:hover { background: var(--sand); color: var(--ocean); }
.d-meal  { background: #27A060; }
.d-pool  { background: #1A6EA0; }
.d-out   { background: var(--coral); }
.d-hotel { background: var(--ocean); }
.d-eve   { background: var(--gold); }
.t-meal  { background: var(--green-bg); color: var(--green); }
.t-pool  { background: var(--blue-bg); color: var(--blue-dark); }
.t-out   { background: #FEF0ED; color: #9A3020; }
.t-hotel { background: var(--foam); color: var(--ocean); }
.t-eve   { background: var(--amber-bg); color: var(--amber); }
.tl-add-btn {
  margin-top: 10px; font-size: 12px; padding: 6px 16px; border-radius: 20px;
  border: 1px dashed var(--sand2); background: transparent; cursor: pointer;
  color: var(--text3); font-family: var(--sans); transition: all .15s;
}
.tl-add-btn:hover { background: var(--foam); color: var(--ocean); border-style: solid; }

/* ───── ACTIVITY ───── */
.region-head {
  font-family: var(--serif); font-size: 1.5rem; font-weight: 400; font-style: italic;
  color: var(--ocean); margin: 28px 0 14px; padding-left: 2px;
  border-bottom: 1px solid var(--sand2); padding-bottom: 8px;
}
.act-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px; margin-bottom: 8px;
}
.act-card {
  background: var(--white); border: 1px solid var(--sand2);
  border-radius: var(--r-lg); padding: 0; overflow: hidden;
  transition: box-shadow .2s, transform .2s;
}
.act-card:hover { box-shadow: 0 8px 28px rgba(12,31,44,.1); transform: translateY(-2px); }
.act-card-top {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--mist);
}
.act-icon-wrap {
  width: 42px; height: 42px; border-radius: 12px; display: flex;
  align-items: center; justify-content: center; font-size: 22px;
  background: var(--foam); margin-bottom: 10px;
}
.act-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
.act-desc { font-size: 12px; color: var(--text2); line-height: 1.55; }
.act-card-bot {
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.act-price { font-size: 11px; color: var(--text3); flex: 1; }
.act-note-txt { font-size: 11px; color: var(--text3); font-style: italic; padding: 4px 14px 0; }
.act-status {
  font-size: 10.5px; font-weight: 600; padding: 3px 11px; border-radius: 20px;
  cursor: pointer; border: none; font-family: var(--sans); transition: all .15s;
  background: var(--mist); color: var(--text3); flex-shrink:0;
}
.act-status.booked { background: var(--blue-bg); color: var(--blue-dark); }
.act-status.done   { background: var(--green-bg); color: var(--green); }
.act-edit-btn {
  font-size: 11px; padding: 3px 9px; border-radius: 8px;
  border: 1px solid var(--sand2); background: transparent; cursor: pointer;
  color: var(--text3); flex-shrink:0;
}
.act-edit-btn:hover { background: var(--foam); }

/* ───── RESTAURANTS ───── */
.r-search-bar { margin-bottom: 12px; }
.r-search-input {
  width: 100%; padding: 10px 16px; border: 1.5px solid var(--sand2);
  border-radius: 12px; font-size: 13px; background: var(--white);
  font-family: var(--sans); outline: none; color: var(--text);
  transition: border-color .2s;
}
.r-search-input:focus { border-color: var(--sea); }
.r-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.r-filter {
  font-size: 12px; padding: 5px 14px; border-radius: 20px;
  border: 1.5px solid var(--sand2); cursor: pointer; background: transparent;
  color: var(--text2); transition: all .15s; font-family: var(--sans);
}
.r-filter.on { background: var(--ocean); color: var(--white); border-color: var(--ocean); }
.r-grid { display: flex; flex-direction: column; gap: 10px; }
.r-card {
  background: var(--white); border: 1px solid var(--sand2);
  border-radius: var(--r-lg); padding: 16px 18px; display: flex; gap: 14px;
  transition: box-shadow .2s;
}
.r-card:hover { box-shadow: 0 4px 18px rgba(12,31,44,.07); }
.r-emoji-col {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--foam); display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.r-info { flex: 1; min-width: 0; }
.r-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.r-name { font-size: 15px; font-weight: 600; color: var(--text); }
.r-visited-badge {
  font-size: 10px; background: var(--green-bg); color: var(--green);
  padding: 2px 9px; border-radius: 20px; font-weight: 600; flex-shrink:0;
}
.r-cat { font-size: 11.5px; color: var(--coral); font-weight: 500; }
.r-region-pill {
  display: inline-block; font-size: 10.5px; background: var(--foam);
  color: var(--ocean); padding: 2px 9px; border-radius: 10px; margin-left: 6px;
}
.r-desc { font-size: 12.5px; color: var(--text2); line-height: 1.55; margin-top: 4px; }
.r-note { font-size: 11.5px; color: var(--text3); margin-top: 3px; font-style: italic; }
.r-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.visit-btn {
  font-size: 12px; padding: 5px 14px; border-radius: 20px;
  border: 1.5px solid var(--sand2); background: transparent; cursor: pointer;
  color: var(--text2); font-family: var(--sans); transition: all .15s;
}
.visit-btn.on { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.r-edit-btn, .r-del-btn {
  font-size: 12px; padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid var(--sand2); background: transparent;
  cursor: pointer; font-family: var(--sans); transition: all .15s;
}
.r-edit-btn { color: var(--ocean); }
.r-del-btn  { color: var(--coral); }
.r-edit-btn:hover { background: var(--foam); border-color: var(--sea); }
.r-del-btn:hover  { background: #FEF0ED; border-color: var(--coral); }

/* ───── HOTELS ───── */
.hotel-block { margin-bottom: 36px; }
.hotel-hdr {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
  flex-wrap: wrap;
}
.hotel-hdr-name {
  font-family: var(--serif); font-size: 1.6rem; font-weight: 400;
  color: var(--ocean); line-height: 1.1;
}
.hotel-period-badge {
  font-size: 11px; font-weight: 600; padding: 4px 13px; border-radius: 20px;
  background: var(--ocean); color: var(--white); letter-spacing: .02em;
}
.hotel-table-wrap {
  background: var(--white); border: 1px solid var(--sand2);
  border-radius: var(--r-lg); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--ocean); color: rgba(255,255,255,.75);
  font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; padding: 11px 14px; text-align: left;
}
tbody tr { transition: background .1s; }
tbody tr:hover td { background: var(--mist); }
tbody td {
  padding: 11px 14px; border-bottom: 1px solid var(--mist);
  font-size: 13px; vertical-align: middle; line-height: 1.5;
}
tbody tr:last-child td { border-bottom: none; }
.badge {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: 2px 9px; border-radius: 20px;
}
.badge-free { background: var(--foam); color: var(--ocean); }
.badge-paid { background: #FEF0ED; color: #A0441C; }
.fac-done {
  width: 34px; height: 34px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; cursor: pointer;
  font-size: 16px; color: var(--sand2); transition: all .15s;
  border: 1.5px solid var(--sand2);
}
.fac-done:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.fac-done.on { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.hotel-tip {
  background: linear-gradient(135deg, var(--foam), #F0FAF5);
  border-left: 3px solid var(--sea); border-radius: 0 var(--r) var(--r) 0;
  padding: 12px 16px; font-size: 12.5px; color: var(--ocean);
  margin-top: 10px; line-height: 1.6;
}

/* ───── FAB ───── */
.fab {
  position: fixed; bottom: 28px; right: 22px;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--ocean); color: var(--white); font-size: 26px;
  border: none; cursor: pointer;
  box-shadow: 0 6px 20px rgba(26,74,92,.4); z-index: 90;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .15s, box-shadow .15s;
}
.fab:hover { background: var(--sea); transform: scale(1.05); box-shadow: 0 8px 28px rgba(26,74,92,.5); }
.fab.hidden { display: none; }

/* ───── MODAL ───── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(12,31,44,.5);
  backdrop-filter: blur(4px); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.on { display: flex; }
.modal {
  background: var(--white); border-radius: 22px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(12,31,44,.25);
  animation: modalIn .2s cubic-bezier(.2,.8,.4,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-head {
  padding: 22px 22px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; color: var(--ocean); }
.modal-close {
  font-size: 18px; cursor: pointer; color: var(--text3);
  background: var(--mist); border: none; border-radius: 50%;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.modal-close:hover { background: var(--sand2); }
.modal-body { padding: 18px 22px; }
.form-row { margin-bottom: 14px; }
.form-label {
  font-size: 11.5px; font-weight: 600; color: var(--text2);
  margin-bottom: 6px; display: block; letter-spacing: .02em;
}
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--sand2);
  border-radius: 10px; font-size: 13px; font-family: var(--sans); outline: none;
  background: var(--cream); color: var(--text); transition: border-color .2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--sea); background: var(--white); }
.form-textarea { resize: vertical; min-height: 82px; }
.modal-footer {
  padding: 0 22px 22px;
  display: flex; gap: 8px; justify-content: flex-end;
}
.btn-cancel {
  padding: 9px 20px; border-radius: 20px; border: 1.5px solid var(--sand2);
  background: transparent; cursor: pointer; font-size: 13px; font-family: var(--sans);
  color: var(--text2); transition: all .15s;
}
.btn-cancel:hover { background: var(--mist); }
.btn-save {
  padding: 9px 22px; border-radius: 20px; border: none;
  background: var(--ocean); color: var(--white); cursor: pointer;
  font-size: 13px; font-family: var(--sans); font-weight: 600;
  transition: background .15s;
}
.btn-save:hover { background: var(--sea); }

/* ───── EMPTY ───── */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text3);
  font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty-state::before { content: '🌊'; font-size: 32px; }

/* ───── RESPONSIVE ───── */
@media (max-width: 640px) {
  .trip-strip { display: none; }
  .r-card { flex-direction: column; }
  .r-emoji-col { width: 40px; height: 40px; }
  .act-grid { grid-template-columns: 1fr 1fr; }
  .header-brand { padding-right: 14px; }
  .brand-name { font-size: 1.05rem; }
  tbody td { padding: 9px 10px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- HEADER + TABS -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-name">Phú <em>Quốc</em></div>
      <div class="brand-dates">7 / 24 – 8 / 7 · 2025</div>
    </div>
    <div class="header-tabs">
      <button class="htab on" onclick="switchTab('schedule')">
        <span class="htab-icon">📅</span> 일정표
      </button>
      <button class="htab" onclick="switchTab('activities')">
        <span class="htab-icon">🌊</span> 액티비티

// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
const DATA_VERSION = 1;
const SERVER_URL = 'https://osaka-trip-server.onrender.com';
let state = {};

function getDefaultState() {
  return {
    version: DATA_VERSION,
    schedule: SEED_SCHEDULE.map(d => ({...d, items: d.items.map(i => ({...i, done: false}))})),
    activities: JSON.parse(JSON.stringify(SEED_ACTIVITIES)),
    restaurants: JSON.parse(JSON.stringify(SEED_RESTAURANTS)),
    hotelDone: {},
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem('phuquoc2025');
    if (saved) { state = JSON.parse(saved); return; }
  } catch(e) {}
  state = getDefaultState();
}

function saveState() {
  localStorage.setItem('phuquoc2025', JSON.stringify(state));
  syncToServer();
}

// ──────────────────────────────────────────────
// SYNC
// ──────────────────────────────────────────────
let _syncTimer = null;
function setSyncStatus(s) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = {idle:'', syncing:'🔄', ok:'☁️', error:'⚠️'};
  const tip = {idle:'', syncing:'저장 중…', ok:'서버 동기화됨', error:'서버 저장 실패 (로컬 저장됨)'};
  el.textContent = map[s] || '';
  el.title = tip[s] || '';
}
function syncToServer() {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    setSyncStatus('syncing');
    try {
      const res = await fetch(`${SERVER_URL}/phuquoc/state`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state),
      });
      setSyncStatus(res.ok ? 'ok' : 'error');
    } catch(e) { setSyncStatus('error'); }
  }, 800);
}
async function loadFromServer() {
  try {
    const res = await fetch(`${SERVER_URL}/phuquoc/state`);
    if (!res.ok) return;
    const sv = await res.json();
    if (!sv || !sv.version) return;
    state = sv;
    localStorage.setItem('phuquoc2025', JSON.stringify(state));
    renderMain();
    setSyncStatus('ok');
  } catch(e) {}
}

// ──────────────────────────────────────────────
// TABS
// ──────────────────────────────────────────────
let activeTab = 'schedule';
function switchTab(id) {
  activeTab = id;
  const labels = {schedule:'일정표',activities:'액티비티',restaurants:'맛집',hotels:'호텔'};
  document.querySelectorAll('.htab').forEach(b => b.classList.toggle('on', b.textContent.includes(labels[id]||'')));
  const fab = document.getElementById('fab');
  fab.classList.toggle('hidden', id === 'hotels');
  renderMain();
}
function handleFab() {
  if (activeTab === 'schedule') showAddTimelineModal(0);
  else if (activeTab === 'activities') showAddActivityModal();
  else if (activeTab === 'restaurants') showAddRestaurantModal();
}
function renderMain() {
  const main = document.getElementById('main');
  if (activeTab === 'schedule') main.innerHTML = renderSchedule();
  else if (activeTab === 'activities') main.innerHTML = renderActivities();
  else if (activeTab === 'restaurants') main.innerHTML = renderRestaurants();
  else if (activeTab === 'hotels') main.innerHTML = renderHotels();
}

// ──────────────────────────────────────────────
// SCHEDULE
// ──────────────────────────────────────────────
function renderSchedule() {
  const doneCount = state.schedule.reduce((acc, d) => acc + d.items.filter(i => i.done).length, 0);
  const totalCount = state.schedule.reduce((acc, d) => acc + d.items.length, 0);
  return `
  <div class="stat-row">
    <div class="stat-card accent"><div class="stat-num">${state.schedule.length}</div><div class="stat-lbl">총 일수</div></div>
    <div class="stat-card"><div class="stat-num">${doneCount}</div><div class="stat-lbl">완료 항목</div></div>
    <div class="stat-card"><div class="stat-num">${totalCount - doneCount}</div><div class="stat-lbl">남은 항목</div></div>
    <div class="stat-card"><div class="stat-num">${Math.round(doneCount/Math.max(totalCount,1)*100)}%</div><div class="stat-lbl">진행률</div></div>
  </div>
  <div class="note-box">⚡ 사전 예약 필수: INK 360 선셋 좌석 / 4섬 호핑투어 / 빈펄 사파리+빈원더스 / 혼똔섬 케이블카 / 각 리조트 스파</div>
  <div style="margin-top:16px">
    ${state.schedule.map((day, di) => `
    <div class="day-card" id="daycard-${di}">
      <div class="day-top" onclick="toggleDay(${di})">
        <span class="day-num">${day.d}</span>
        <span class="day-ttl">${day.title}</span>
        <span class="day-badge">${day.hotel}</span>
        <span class="day-arr">▼</span>
      </div>
      <div class="day-body">
        <div class="tl">
          ${day.items.map((item, ii) => renderTLItem(di, item, ii)).join('')}
        </div>
        <button class="tl-add-btn" onclick="showAddTimelineModal(${di})">＋ 항목 추가</button>
      </div>
    </div>`).join('')}
  </div>`;
}

function toggleDay(di) {
  document.getElementById('daycard-' + di).classList.toggle('open');
}

const DOT_CLASS = {meal:'d-meal',pool:'d-pool',out:'d-out',hotel:'d-hotel',eve:'d-eve'};
const TAG_CLASS = {meal:'t-meal',pool:'t-pool',out:'t-out',hotel:'t-hotel',eve:'t-eve'};

function renderTLItem(di, item, ii) {
  const isLast = ii === state.schedule[di].items.length - 1;
  const tagHtml = item.tag ? `<span class="tag ${TAG_CLASS[item.tagType]||TAG_CLASS[item.type]||'t-hotel'}">${item.tag}</span>` : '';
  return `<div class="tl-row${item.done?' done':''}" onclick="toggleTLDone(${di},${ii})">
    <span class="tl-time">${item.time}</span>
    <div class="tl-dot-col">
      <span class="tl-dot ${DOT_CLASS[item.type]||'d-hotel'}"></span>
    </div>
    <div class="tl-body">
      <span class="tl-text">${item.text}${tagHtml}</span>
      <div class="tl-actions">
        <button class="tl-act-btn" onclick="event.stopPropagation();showEditTLModal(${di},${ii})">✎</button>
        <button class="tl-act-btn" onclick="event.stopPropagation();deleteTLItem(${di},${ii})">✕</button>
      </div>
    </div>
  </div>`;
}

function toggleTLDone(di, ii) {
  state.schedule[di].items[ii].done = !state.schedule[di].items[ii].done;
  saveState();
  renderMain();
  document.getElementById('daycard-' + di)?.classList.add('open');
}

function deleteTLItem(di, ii) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  state.schedule[di].items.splice(ii, 1);
  saveState(); renderMain();
  document.getElementById('daycard-' + di)?.classList.add('open');
}

// ACTIVITIES
// ──────────────────────────────────────────────
let aFilterRegion = 'all';
function renderActivities() {
  const regions = [...new Set(state.activities.map(a => a.region))];
  const filtered = aFilterRegion === 'all' ? state.activities : state.activities.filter(a => a.region === aFilterRegion);
  const booked = state.activities.filter(a => a.status === 'booked').length;
  const done = state.activities.filter(a => a.status === 'done').length;
  return `
  <div class="stat-row">
    <div class="stat-card accent"><div class="stat-num">${state.activities.length}</div><div class="stat-lbl">총 액티비티</div></div>
    <div class="stat-card"><div class="stat-num">${booked}</div><div class="stat-lbl">예약완료</div></div>
    <div class="stat-card"><div class="stat-num">${done}</div><div class="stat-lbl">완료</div></div>
    <div class="stat-card"><div class="stat-num">${state.activities.length - booked - done}</div><div class="stat-lbl">미예약</div></div>
  </div>
  <div class="r-filters">
    <span class="r-filter${aFilterRegion==='all'?' on':''}" onclick="aFilterRegion='all';renderMain()">전체</span>
    ${regions.map(r => `<span class="r-filter${aFilterRegion===r?' on':''}" onclick="aFilterRegion='${r}';renderMain()">${r}</span>`).join('')}
  </div>
  ${filtered.length === 0 ? '<div class="empty-state">액티비티가 없어요</div>' : ''}
  ${regions.filter(r => aFilterRegion==='all' || aFilterRegion===r).map(region => {
    const acts = filtered.filter(a => a.region === region);
    if (!acts.length) return '';
    return `<div class="region-heading">${region}</div>
    <div class="act-grid">${acts.map(a => renderActCard(a)).join('')}</div>`;
  }).join('')}`;
}

function renderActCard(a) {
  const s = a.status || '';
  return `<div class="act-card">
    <div class="act-card-top">
      <div class="act-icon-wrap">${a.icon}</div>
      <div class="act-name">${a.name}</div>
      <div class="act-desc">${a.desc}</div>
      ${a.note ? `<div class="act-note-txt">${a.note}</div>` : ''}
    </div>
    <div class="act-card-bot">
      <span class="act-price">${a.price}</span>
      <button class="act-status${s==='booked'?' booked':s==='done'?' done':''}" onclick="cycleActStatus('${a.id}')">${s==='done'?'✓ 완료':s==='booked'?'예약완료':'예약 전'}</button>
      <button class="act-edit-btn" onclick="showEditActivityModal('${a.id}')">✎</button>
    </div>
  </div>`;
}

function cycleActStatus(id) {
  const a = state.activities.find(x => x.id === id);
  if (!a) return;
  a.status = a.status === '' ? 'booked' : a.status === 'booked' ? 'done' : '';
  saveState(); renderMain();
}

function deleteActivity(id) {
  if (!confirm('이 액티비티를 삭제할까요?')) return;
  state.activities = state.activities.filter(a => a.id !== id);
  saveState(); renderMain();
}

// ──────────────────────────────────────────────
// RESTAURANTS
// ──────────────────────────────────────────────
let rSearch = '', rFilterRegion = 'all';
function renderRestaurants() {
  const regions = [...new Set(state.restaurants.map(r => r.region))];
  const filtered = state.restaurants.filter(r => {
    const matchSearch = !rSearch || r.name.toLowerCase().includes(rSearch.toLowerCase()) || r.desc.toLowerCase().includes(rSearch.toLowerCase());
    const matchRegion = rFilterRegion === 'all' || r.region === rFilterRegion;
    return matchSearch && matchRegion;
  });
  const visited = state.restaurants.filter(r => r.visited).length;
  return `
  <div class="stat-row">
    <div class="stat-card accent"><div class="stat-num">${state.restaurants.length}</div><div class="stat-lbl">총 맛집</div></div>
    <div class="stat-card"><div class="stat-num">${visited}</div><div class="stat-lbl">방문완료</div></div>
    <div class="stat-card"><div class="stat-num">${state.restaurants.length - visited}</div><div class="stat-lbl">미방문</div></div>
  </div>
  <div class="r-search-bar">
    <input class="r-search-input" placeholder="🔍 맛집 이름, 메뉴 검색..." value="${rSearch}" oninput="rSearch=this.value;renderMain()">
  </div>
  <div class="r-filters">
    <span class="r-filter${rFilterRegion==='all'?' on':''}" onclick="rFilterRegion='all';renderMain()">전체</span>
    ${regions.map(r => `<span class="r-filter${rFilterRegion===r?' on':''}" onclick="rFilterRegion='${r}';renderMain()">${r}</span>`).join('')}
  </div>
  <div class="note-box">💡 현금 필수: 야시장·로컬 식당은 현금(베트남 동) 결제만 가능. 고수 빼달라고 할 때: "không ngò" (콩응오)</div>
  <div class="r-grid" style="margin-top:14px">
    ${filtered.length === 0 ? '<div class="empty-state">검색 결과가 없어요</div>' : filtered.map(r => renderRestCard(r)).join('')}
  </div>`;
}

function renderRestCard(r) {
  return `<div class="r-card">
    <div class="r-emoji-col">${r.emoji||'🍴'}</div>
    <div class="r-info">
      <div class="r-top">
        <span class="r-name">${r.name}</span>
        ${r.visited?'<span class="r-visited-badge">✓ 방문완료</span>':''}
      </div>
      <div><span class="r-cat">${r.category}</span><span class="r-region-pill">${r.region}</span></div>
      <div class="r-desc">${r.desc}</div>
      ${r.note ? `<div class="r-note">📝 ${r.note}</div>` : ''}
      <div class="r-actions">
        <button class="visit-btn${r.visited?' on':''}" onclick="toggleVisited('${r.id}')">${r.visited?'✓ 방문완료':'방문 체크'}</button>
        <button class="r-edit-btn" onclick="showEditRestModal('${r.id}')">편집</button>
        <button class="r-del-btn" onclick="deleteRest('${r.id}')">삭제</button>
      </div>
    </div>
  </div>`;
}

function toggleVisited(id) {
  const r = state.restaurants.find(x => x.id === id);
  if (r) { r.visited = !r.visited; saveState(); renderMain(); }
}
function deleteRest(id) {
  if (!confirm('이 맛집을 삭제할까요?')) return;
  state.restaurants = state.restaurants.filter(r => r.id !== id);
  saveState(); renderMain();
}

// ──────────────────────────────────────────────
// HOTELS
// ──────────────────────────────────────────────
function renderHotels() {
  const doneKeys = Object.keys(state.hotelDone||{}).filter(k=>state.hotelDone[k]);
  return SEED_HOTELS.map(hotel => {
    const totalFac = hotel.facilities.length;
    const doneFac = hotel.facilities.filter((_,fi)=>state.hotelDone&&state.hotelDone[hotel.id+'_'+fi]).length;
    return `
  <div class="hotel-block">
    <div class="hotel-hdr">
      <span class="hotel-hdr-name">${hotel.name}</span>
      <span class="hotel-period-badge">${hotel.period}</span>
      <span style="font-size:12px;color:var(--text3);margin-left:4px">${doneFac}/${totalFac} 이용완료</span>
    </div>
    <div class="hotel-table-wrap">
      <table>
        <thead><tr><th style="width:50px">완료</th><th>구분</th><th>시설 / 프로그램</th><th>운영시간</th><th>비고</th></tr></thead>
        <tbody>
        ${hotel.facilities.map((f, fi) => {
          const key = hotel.id + '_' + fi;
          const done = !!(state.hotelDone && state.hotelDone[key]);
          return `<tr>
            <td><div class="fac-done${done?' on':''}" onclick="toggleFacDone('${hotel.id}',${fi})" title="완료 체크">${done?'✓':'○'}</div></td>
            <td><span class="badge badge-${f.type}">${f.type==='free'?'무료':'유료'}</span></td>
            <td style="font-weight:500">${f.name}</td>
            <td style="color:var(--text3)">${f.hours}</td>
            <td style="color:var(--text3)">${f.note}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
    <div class="hotel-tip">💡 ${hotel.tip}</div>
  </div>`;
  }).join('');
}

function toggleFacDone(hotelId, fi) {
  if (!state.hotelDone) state.hotelDone = {};
  const key = hotelId + '_' + fi;
  state.hotelDone[key] = !state.hotelDone[key];
  saveState(); renderMain();
}

// ──────────────────────────────────────────────
// MODAL SYSTEM
// ──────────────────────────────────────────────
let modalMode = null, modalCtx = {};
function showModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('on');
}
function hideModal() { document.getElementById('modalOverlay').classList.remove('on'); }
function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) hideModal(); }

// ─── Timeline Modal ───
function showAddTimelineModal(di) {
  modalMode = 'addTL'; modalCtx = { di };
  showModal('항목 추가', tlForm({time:'',type:'hotel',text:'',tag:'',tagType:''}));
}
function showEditTLModal(di, ii) {
  modalMode = 'editTL'; modalCtx = { di, ii };
  showModal('항목 편집', tlForm(state.schedule[di].items[ii]));
}
function tlForm(item) {
  return `
  <div class="form-row"><label class="form-label">시간</label>
    <input class="form-input" id="f-time" value="${item.time||''}" placeholder="예: 09:00">
  </div>
  <div class="form-row"><label class="form-label">유형</label>
    <select class="form-select" id="f-type">
      ${['meal','pool','out','hotel','eve'].map(t => `<option value="${t}"${item.type===t?' selected':''}>${{meal:'🍽 식사',pool:'🏊 풀/비치',out:'🗺 외출/관광',hotel:'🏨 호텔',eve:'🌅 이벤트'}[t]}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="form-label">내용</label>
    <input class="form-input" id="f-text" value="${(item.text||'').replace(/"/g,'&quot;')}" placeholder="일정 내용">
  </div>
  <div class="form-row"><label class="form-label">태그 (선택)</label>
    <input class="form-input" id="f-tag" value="${item.tag||''}" placeholder="예: 예약 필수">
  </div>`;
}

// ─── Activity Modal ───
function showAddActivityModal() {
  modalMode = 'addAct'; modalCtx = {};
  showModal('액티비티 추가', actForm({icon:'🌊',region:'중부 롱비치',name:'',desc:'',price:'',note:''}));
}
function showEditActivityModal(id) {
  modalMode = 'editAct'; modalCtx = { id };
  const a = state.activities.find(x => x.id === id);
  showModal('액티비티 편집', actForm(a));
}
function actForm(a) {
  const regions = ['중부 롱비치','북서부 바이다이','남부 켐 비치'];
  return `
  <div class="form-row"><label class="form-label">아이콘</label>
    <input class="form-input" id="f-icon" value="${a.icon||'🌊'}">
  </div>
  <div class="form-row"><label class="form-label">지역</label>
    <select class="form-select" id="f-region">
      ${regions.map(r => `<option value="${r}"${a.region===r?' selected':''}>${r}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="form-label">이름</label>
    <input class="form-input" id="f-name" value="${(a.name||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">설명</label>
    <textarea class="form-textarea" id="f-desc">${a.desc||''}</textarea>
  </div>
  <div class="form-row"><label class="form-label">가격/시간</label>
    <input class="form-input" id="f-price" value="${(a.price||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">메모</label>
    <input class="form-input" id="f-note" value="${(a.note||'').replace(/"/g,'&quot;')}" placeholder="개인 메모">
  </div>`;
}

// ─── Restaurant Modal ───
function showAddRestModal() {
  modalMode = 'addRest'; modalCtx = {};
  showModal('맛집 추가', restForm({emoji:'🍴',name:'',region:'중부 소나시',category:'',desc:'',note:''}));
}
function showAddRestaurantModal() { showAddRestModal(); }
function showEditRestModal(id) {
  modalMode = 'editRest'; modalCtx = { id };
  const r = state.restaurants.find(x => x.id === id);
  showModal('맛집 편집', restForm(r));
}
function restForm(r) {
  const regions = ['중부 소나시','북부 그랜드월드','남부 켐 비치'];
  return `
  <div class="form-row"><label class="form-label">이모지</label>
    <input class="form-input" id="f-emoji" value="${r.emoji||'🍴'}">
  </div>
  <div class="form-row"><label class="form-label">이름</label>
    <input class="form-input" id="f-name" value="${(r.name||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">지역</label>
    <select class="form-select" id="f-region">
      ${regions.map(rg => `<option value="${rg}"${r.region===rg?' selected':''}>${rg}</option>`).join('')}
    </select>
  </div>
  <div class="form-row"><label class="form-label">카테고리</label>
    <input class="form-input" id="f-category" value="${(r.category||'').replace(/"/g,'&quot;')}">
  </div>
  <div class="form-row"><label class="form-label">설명</label>
    <textarea class="form-textarea" id="f-desc">${r.desc||''}</textarea>
  </div>
  <div class="form-row"><label class="form-label">메모</label>
    <input class="form-input" id="f-note" value="${(r.note||'').replace(/"/g,'&quot;')}" placeholder="개인 메모">
  </div>`;
}

// ─── Save Modal ───
function saveModal() {
  const g = id => document.getElementById(id)?.value?.trim() || '';
  if (modalMode === 'addTL' || modalMode === 'editTL') {
    const item = { time:g('f-time'), type:g('f-type'), text:g('f-text'), tag:g('f-tag'), tagType:g('f-type'), done: false };
    if (!item.text) return alert('내용을 입력해주세요');
    if (modalMode === 'addTL') {
      state.schedule[modalCtx.di].items.push(item);
    } else {
      item.done = state.schedule[modalCtx.di].items[modalCtx.ii].done;
      state.schedule[modalCtx.di].items[modalCtx.ii] = item;
    }
    saveState(); hideModal(); renderMain();
    document.getElementById('daycard-' + modalCtx.di)?.classList.add('open');
  } else if (modalMode === 'addAct' || modalMode === 'editAct') {
    const a = { icon:g('f-icon'), region:g('f-region'), name:g('f-name'), desc:g('f-desc'), price:g('f-price'), note:g('f-note') };
    if (!a.name) return alert('이름을 입력해주세요');
    if (modalMode === 'addAct') {
      a.id = 'a' + Date.now(); a.status = '';
      state.activities.push(a);
    } else {
      const idx = state.activities.findIndex(x => x.id === modalCtx.id);
      state.activities[idx] = { ...state.activities[idx], ...a };
    }
    saveState(); hideModal(); renderMain();
  } else if (modalMode === 'addRest' || modalMode === 'editRest') {
    const r = { emoji:g('f-emoji'), name:g('f-name'), region:g('f-region'), category:g('f-category'), desc:g('f-desc'), note:g('f-note') };
    if (!r.name) return alert('이름을 입력해주세요');
    if (modalMode === 'addRest') {
      r.id = 'r' + Date.now(); r.visited = false;
      state.restaurants.push(r);
    } else {
      const idx = state.restaurants.findIndex(x => x.id === modalCtx.id);
      state.restaurants[idx] = { ...state.restaurants[idx], ...r };
    }
    saveState(); hideModal(); renderMain();
  }
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
loadState();
renderMain();
loadFromServer();

</script>
</body>
</html>
